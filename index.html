<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마감방 - 웹소설 작가 작업실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face {
            font-family: 'LeeSeoyun';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/LeeSeoyun.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        body { font-family: 'LeeSeoyun', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #FAFAFA; color: #111827; font-size: 1.05rem; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }

        .card-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.03); }
        
        .tab-content { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .tab-content.active { display: block; opacity: 1; }
        
        .video-blur { filter: blur(4px) brightness(0.95); }
        .hidden-safely { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-gray-200 overflow-hidden">

    <!-- Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-900/60 backdrop-blur-md z-50 flex items-center justify-center transition-all duration-300">
        <div class="bg-white rounded-3xl p-8 card-shadow max-w-md w-full mx-4 text-center transform transition-all duration-300 scale-100">
            <div class="w-16 h-16 bg-gray-900 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-3xl mb-4 shadow-sm">M</div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">마감방 입장</h2>
            <p class="text-gray-500 text-sm mb-6 font-[Pretendard]">함께 마감할 동료들에게 보여질 닉네임을 입력해주세요.</p>
            <div class="space-y-4">
                <input type="text" id="nickname-input" required class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-5 py-4 text-center text-lg focus:ring-2 focus:ring-gray-900 outline-none font-[Pretendard] font-bold text-gray-900 placeholder-gray-300" placeholder="닉네임 (예: 김작가)" onkeypress="if(event.keyCode===13){ window.startLoginProcess(); }">
                <button type="button" onclick="window.startLoginProcess()" class="w-full py-4 bg-gray-900 text-white rounded-2xl font-bold text-lg hover:bg-gray-800 transition-colors shadow-lg shadow-gray-200 cursor-pointer">입장하기</button>
            </div>
        </div>
    </div>

    <!-- Toast Message -->
    <div id="toast-container" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-50 hidden-safely transition-all duration-300">
        <div id="toast-message" class="bg-gray-900 text-white px-6 py-3 rounded-2xl shadow-2xl font-medium text-sm flex items-center gap-2">
            알림 메시지
        </div>
    </div>

    <!-- Header & Navigation -->
    <header class="glass-header sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gray-900 rounded-xl flex items-center justify-center text-white font-bold text-lg leading-none shadow-sm">M</div>
                <h1 class="text-lg font-bold tracking-tight text-gray-900 flex items-center gap-2">
                    마감방
                    <button id="btn-logout" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2 py-1 rounded-md transition-colors font-normal hidden md:block">닉네임 변경</button>
                </h1>
            </div>
            
            <nav class="hidden md:flex items-center gap-8">
                <button class="nav-btn text-gray-900 font-semibold border-b-2 border-gray-900 pb-1" data-target="tab-room">집필실</button>
                <button class="nav-btn text-gray-400 hover:text-gray-900 font-medium pb-1 transition-colors" data-target="tab-journal">개인 집필 일지</button>
                <button class="nav-btn text-gray-400 hover:text-gray-900 font-medium pb-1 transition-colors" data-target="tab-community">Log</button>
            </nav>

            <div class="flex items-center gap-3">
                <div id="auth-status" class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></div>
                <span id="user-info" class="text-xs text-gray-500 font-medium hidden md:block">연결 대기중...</span>
            </div>
        </div>
        <nav class="md:hidden flex items-center gap-6 px-6 pb-3 overflow-x-auto">
            <button class="nav-btn text-gray-900 font-semibold border-b-2 border-gray-900 whitespace-nowrap" data-target="tab-room">집필실</button>
            <button class="nav-btn text-gray-400 hover:text-gray-900 font-medium whitespace-nowrap" data-target="tab-journal">개인 집필 일지</button>
            <button class="nav-btn text-gray-400 hover:text-gray-900 font-medium whitespace-nowrap" data-target="tab-community">Log</button>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 w-full py-8">
        <section id="tab-room" class="tab-content active space-y-8">
            <div class="bg-white rounded-3xl p-5 card-shadow border border-gray-100 flex flex-col sm:flex-row items-center gap-4">
                <span class="text-gray-500 font-bold whitespace-nowrap sm:pl-4">오늘의 목표</span>
                <input type="text" id="room-goal-input" class="flex-1 w-full bg-transparent border-none outline-none text-gray-900 placeholder-gray-300 px-2 text-center sm:text-left" placeholder="마감 목표를 한 줄로 적어주세요 (예: 15화 초고 완성)">
                <button id="btn-save-goal" class="w-full sm:w-auto px-6 py-2.5 bg-gray-900 text-white rounded-xl hover:bg-gray-800 transition-colors shadow-md font-medium">저장</button>
            </div>

            <div class="flex flex-col lg:flex-row gap-8">
                <div class="lg:w-2/3 space-y-6">
                    <div class="flex flex-col md:flex-row md:items-end
