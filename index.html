<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마감방 - 웹소설 작가 작업실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face {
            font-family: 'LeeSeoyun';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/LeeSeoyun.woff') format('woff');
        }
        body { font-family: 'LeeSeoyun', sans-serif; background-color: #F9FAFB; color: #111827; }
        .hidden-safely { display: none !important; }
        .video-blur { filter: blur(8px); }
        .card-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden">

    <!-- 로그인 오버레이 (새로고침 100% 차단) -->
    <div id="login-overlay" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white rounded-3xl p-8 card-shadow max-w-sm w-full mx-4 text-center border border-gray-100">
            <h2 class="text-2xl font-bold mb-6 text-gray-900">마감방 입장</h2>
            <!-- form 태그의 기본 동작을 원천 차단하고 JS 함수만 호출 -->
            <form onsubmit="event.preventDefault(); window.submitLogin();">
                <input type="text" id="nickname-input" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 mb-4 text-center text-lg outline-none" placeholder="닉네임 입력">
                <button type="submit" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold text-lg">입장하기</button>
            </form>
        </div>
    </div>

    <!-- 헤더 -->
    <header class="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-40 p-4 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-xl text-gray-900">마감방</h1>
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse" id="status-dot"></div>
                <span id="user-info" class="text-sm font-bold text-gray-600">대기중...</span>
            </div>
        </div>
    </header>

    <main class="p-4 md:p-6 max-w-6xl mx-auto w-full flex flex-col lg:flex-row gap-6">
        
        <!-- 왼쪽: 화면 공유 영역 -->
        <div class="lg:w-2/3 flex flex-col gap-4">
            <div class="flex flex-wrap justify-between items-center bg-white p-4 rounded-2xl border border-gray-100 card-shadow">
                <label class="flex items-center gap-2 cursor-pointer font-bold text-gray-700">
                    <input type="checkbox" id="blur-toggle" checked class="w-4 h-4 rounded text-gray-900"> 모자이크
                </label>
                <div class="flex gap-2">
                    <button id="btn-cam" class="bg-gray-100 hover:bg-gray-200 text-gray-800 px-4 py-2 rounded-xl font-bold text-sm">웹캠 켜기</button>
                    <button id="btn-screen" class="bg-gray-900 hover:bg-gray-800 text-white px-4 py-2 rounded-xl font-bold text-sm">화면 공유</button>
                    <button id="btn-stop" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl font-bold text-sm hidden-safely">공유 중지</button>
                </div>
            </div>

            <!-- 비디오 그리드 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="video-grid">
                <!-- 내 화면 -->
                <div class="bg-white rounded-3xl overflow-hidden aspect-[4/3] relative border border-gray-100 card-shadow flex items-center justify-center">
                    <video id="video-element" class="w-full h-full object-cover hidden-safely video-blur absolute inset-0 z-10" autoplay playsinline muted></video>
                    <div id="video-placeholder" class="z-0 flex flex-col items-center">
                        <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 font-bold text-xl mb-2">나</div>
                        <span class="text-sm font-bold text-gray-400">내 화면 대기중</span>
                    </div>
                    <div class="absolute top-3 left-3 bg-black/60 text-white px-3 py-1.5 rounded-full text-xs font-bold z-20 flex items-center gap-2">
                        <span id="live-dot" class="w-1.5 h-1.5 rounded-full bg-red-500 hidden-safely animate-pulse"></span>
                        나 (<span class="daily-time-display">00:00:00</span>)
                    </div>
                </div>
                
                <!-- 다른 사람 화면 렌더링 영역 -->
                <div id="other-users-grid" class="contents"></div>
            </div>
        </div>

        <!-- 오른쪽: 타이머 영역 -->
        <div class="lg:w-1/3 flex flex-col gap-4">
            <div class="bg-white rounded-3xl p-6 border border-gray-100 card-shadow">
                <h3 class="font-bold text-gray-900 mb-4">하루 2시간 챌린지</h3>
                <div class="flex justify-between items-end mb-2">
                    <span class="text-3xl font-light text-gray-900 daily-time-display">00:00:00</span>
                    <span class="text-gray-400 text-sm font-bold" id="progress-percent">0%</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
                    <div id="progress-bar" class="bg-gray-900 h-full rounded-full transition-all duration-500 w-0"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 모듈 로딩 지연과 상관없이 작동하는 폼 제어 스크립트 -->
    <script>
        window.submitLogin = function() {
            const nick = document.getElementById('nickname-input').value.trim();
            if (!nick) return;
            document.getElementById('login-overlay').style.setProperty('display', 'none', 'important');
            document.body.classList.remove('overflow-hidden');
            // 커스텀 이벤트를 쏴서 뒤늦게 로딩된 Firebase 모듈을 깨움
            window.dispatchEvent(new CustomEvent('init-app', { detail: nick }));
        }
    </script>

    <!-- 파이어베이스 & PeerJS 모듈 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, updateDoc, onSnapshot, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCgNwW2-sWbwW_t3ql8Zkg4osAvR294_x4",
          authDomain: "deadline-room-768bf.firebaseapp.com",
          projectId: "deadline-room-768bf"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let peer = null;
        let myPeerId = null; // 자동 생성된 통신 ID
        let currentCalls = {};
        let publicUsers = [];
        let mediaStream = null;
        let myNick = localStorage.getItem('deadline_nickname');
        
        let dailySharedSeconds = 0;
        const GOAL_SECONDS = 2 * 60 * 60;
        let sharingInterval = null;
        let lastTick = null;

        // 로그인 이벤트 수신
        window.addEventListener('init-app', (e) => {
            myNick = e.detail;
            localStorage.setItem('deadline_nickname', myNick);
            startFirebase();
        });

        // 이미 로컬스토리지에 닉네임이 있으면 자동 실행
        if(myNick) {
            document.getElementById('nickname-input').value = myNick;
            document.getElementById('login-overlay').style.setProperty('display', 'none', 'important');
            document.body.classList.remove('overflow-hidden');
            startFirebase();
        }

        async function startFirebase() {
            await signInAnonymously(auth);
            document.getElementById('user-info').textContent = `${myNick}`;
            document.getElementById('status-dot').classList.replace('bg-yellow-400', 'bg-emerald-500');
            
            // 1. PeerJS 서버에 먼저 붙어서 완벽한 영어 난수 ID를 발급받음
            peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
            
            peer.on('open', (id) => {
                myPeerId = id; // 한글 깨짐 없는 완벽한 ID
                initDB();      // ID 발급 성공 후 DB에 내 상태 기록
            });

            peer.on('call', (call) => {
                call.answer(mediaStream || undefined);
                currentCalls[call.peer] = call;
                call.on('stream', (stream) => renderRemoteVideo(call.peer, stream));
            });
        }

        function initDB() {
            const userRef = doc(db, 'artifacts', 'app', 'users', myNick);
            // 내 진짜 닉네임과 통신용 PeerID를 묶어서 저장
            setDoc(userRef, { id: myNick, peerId: myPeerId, isOnline: true, isSharing: false, lastActive: serverTimestamp() }, {merge: true});
            
            getDoc(userRef).then(snap => {
                if(snap.exists() && snap.data().dailySeconds) dailySharedSeconds = snap.data().dailySeconds;
                updateTimeUI();
            });

            onSnapshot(collection(db, 'artifacts', 'app', 'users'), (snap) => {
                publicUsers = [];
                snap.forEach(d => publicUsers.push(d.data()));
                renderOtherUsers();
                checkAndCallOthers();
            });
        }

        function checkAndCallOthers() {
            if(!myPeerId || !peer) return;
            
            publicUsers.filter(u => u.id !== myNick && u.isOnline && u.peerId).forEach(u => {
                // 내가 화면을 켰거나, 상대가 켰다면
                if((u.isSharing || mediaStream) && !currentCalls[u.peerId]) {
                    const call = mediaStream ? peer.call(u.peerId, mediaStream) : peer.call(u.peerId);
                    if(call) {
                        currentCalls[u.peerId] = call;
                        call.on('stream', (stream) => renderRemoteVideo(u.peerId, stream));
                    }
                }
            });
        }

        async function startStream(type) {
            if(mediaStream) stopStream();
            try {
                mediaStream = await (type === 'cam' ? navigator.mediaDevices.getUserMedia({video:true}) : navigator.mediaDevices.getDisplayMedia({video:true}));
                
                const vidEl = document.getElementById('video-element');
                vidEl.srcObject = mediaStream;
                vidEl.classList.remove('hidden-safely');
                document.getElementById('video-placeholder').classList.add('hidden-safely');
                
                document.getElementById('btn-cam').classList.add('hidden-safely');
                document.getElementById('btn-screen').classList.add('hidden-safely');
                document.getElementById('btn-stop').classList.remove('hidden-safely');
                document.getElementById('live-dot').classList.remove('hidden-safely');
                
                updateDBSharing(true);
                startTimer();
                checkAndCallOthers();
                
                mediaStream.getVideoTracks()[0].onended = stopStream;
            } catch(e) { console.warn(e); }
        }

        function stopStream() {
            if(mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
            
            document.getElementById('video-element').classList.add('hidden-safely');
            document.getElementById('video-placeholder').classList.remove('hidden-safely');
            
            document.getElementById('btn-cam').classList.remove('hidden-safely');
            document.getElementById('btn-screen').classList.remove('hidden-safely');
            document.getElementById('btn-stop').classList.add('hidden-safely');
            document.getElementById('live-dot').classList.add('hidden-safely');
            
            updateDBSharing(false);
            stopTimer();
            Object.values(currentCalls).forEach(c => c.close());
            currentCalls = {};
        }

        function updateDBSharing(isSharing) {
            if(myNick) updateDoc(doc(db, 'artifacts', 'app', 'users', myNick), { isSharing });
        }

        document.getElementById('btn-cam').addEventListener('click', () => startStream('cam'));
        document.getElementById('btn-screen').addEventListener('click', () => startStream('screen'));
        document.getElementById('btn-stop').addEventListener('click', stopStream);
        
        document.getElementById('blur-toggle').addEventListener('change', (e) => {
            const isBlur = e.target.checked;
            document.getElementById('video-element').classList.toggle('video-blur', isBlur);
            document.querySelectorAll('.remote-video').forEach(v => v.classList.toggle('video-blur', isBlur));
        });

        // 껍데기 UI 그리기 (ID 매칭 방식을 닉네임 기반으로 일원화)
        function renderOtherUsers() {
            const grid = document.getElementById('other-users-grid');
            const others = publicUsers.filter(u => u.id !== myNick && u.isOnline);
            
            others.forEach(u => {
                let card = document.getElementById(`card-${u.id}`);
                const h = String(Math.floor((u.dailySeconds || 0) / 3600)).padStart(2, '0');
                const m = String(Math.floor(((u.dailySeconds || 0) % 3600) / 60)).padStart(2, '0');
                
                if(!card) {
                    card = document.createElement('div');
                    card.id = `card-${u.id}`;
                    card.className = "bg-white rounded-3xl overflow-hidden aspect-[4/3] relative border border-gray-100 card-shadow flex items-center justify-center group";
                    card.innerHTML = `
                        <div class="ui-layer z-0 flex flex-col items-center">
                            <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 font-bold text-xl mb-2">${u.id.charAt(0)}</div>
                            <span class="text-sm font-bold text-gray-900">${u.id}</span>
                        </div>
                        <div class="absolute top-3 left-3 bg-black/60 text-white px-3 py-1.5 rounded-full text-xs font-bold z-20 flex items-center gap-2">
                            <span class="dot-indicator w-1.5 h-1.5 rounded-full ${u.isSharing ? 'bg-emerald-400 animate-pulse' : 'bg-gray-400'}"></span>
                            ${u.id} (<span class="remote-time">${h}:${m}</span>)
                        </div>
                    `;
                    grid.appendChild(card);
                } else {
                    card.querySelector('.remote-time').textContent = `${h}:${m}`;
                    const dot = card.querySelector('.dot-indicator');
                    if(dot) dot.className = `dot-indicator w-1.5 h-1.5 rounded-full ${u.isSharing ? 'bg-emerald-400 animate-pulse' : 'bg-gray-400'}`;
                }
            });
            
            Array.from(grid.children).forEach(c => {
                if(!others.find(u => `card-${u.id}` === c.id)) c.remove();
            });
        }

        // 비디오 도착 시 최상단(z-50)에 무조건 강제 부착
        function renderRemoteVideo(incomingPeerId, stream) {
            if(!stream || stream.getVideoTracks().length === 0) return;
            
            // 난수 PeerID를 가진 유저가 누군지 DB 목록에서 찾음
            const targetUser = publicUsers.find(u => u.peerId === incomingPeerId);
            if(!targetUser) return;
            
            const userCard = document.getElementById(`card-${targetUser.id}`);
            if(!userCard) return;
            
            const uiLayer = userCard.querySelector('.ui-layer');
            if(uiLayer) uiLayer.style.display = 'none';

            let vid = userCard.querySelector('video.remote-video');
            if(!vid) {
                vid = document.createElement('video');
                const isBlur = document.getElementById('blur-toggle').checked;
                vid.className = `remote-video absolute inset-0 w-full h-full object-cover z-50 transition-all ${isBlur ? 'video-blur' : ''}`;
                vid.autoplay = true; 
                vid.playsinline = true; 
                vid.muted = true; // 강제 음소거 (브라우저 정책상 필수)
                userCard.appendChild(vid);
            }
            if(vid.srcObject !== stream) vid.srcObject = stream;
        }

        function startTimer() {
            if(sharingInterval) return;
            lastTick = Date.now();
            sharingInterval = setInterval(() => {
                const now = Date.now();
                const delta = Math.floor((now - lastTick) / 1000);
                if(delta > 0) {
                    dailySharedSeconds += delta;
                    lastTick += delta * 1000;
                    updateTimeUI();
                    
                    if(dailySharedSeconds % 10 === 0) {
                        if(myNick) updateDoc(doc(db, 'artifacts', 'app', 'users', myNick), { dailySeconds: dailySharedSeconds });
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(sharingInterval); 
            sharingInterval = null;
        }

        function updateTimeUI() {
            const h = String(Math.floor(dailySharedSeconds / 3600)).padStart(2, '0');
            const m = String(Math.floor((dailySharedSeconds % 3600) / 60)).padStart(2, '0');
            const s = String(dailySharedSeconds % 60).padStart(2, '0');
            
            document.querySelectorAll('.daily-time-display').forEach(el => el.textContent = `${h}:${m}:${s}`);
            const percent = Math.min((dailySharedSeconds / GOAL_SECONDS) * 100, 100);
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-percent').textContent = `${Math.floor(percent)}%`;
        }

        window.addEventListener('beforeunload', () => {
            if(myNick) updateDoc(doc(db, 'artifacts', 'app', 'users', myNick), { isOnline: false, isSharing: false, lastActive: serverTimestamp() });
        });
    </script>
</body>
</html>
