<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마감방 - 웹소설 작가 작업실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face {
            font-family: 'LeeSeoyun';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/LeeSeoyun.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        body { font-family: 'LeeSeoyun', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #FAFAFA; color: #111827; font-size: 1.05rem; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }

        .card-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.03); }
        
        .tab-content { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .tab-content.active { display: block; opacity: 1; }
        
        .video-blur { filter: blur(4px) brightness(0.95); }
        .hidden-safely { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-gray-200 overflow-hidden">

    <!-- 로그인 오버레이 -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-900/60 backdrop-blur-md z-50 flex items-center justify-center">
        <div class="bg-white rounded-3xl p-8 card-shadow max-w-md w-full mx-4 text-center">
            <div class="w-16 h-16 bg-gray-900 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-3xl mb-4 shadow-sm">M</div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">마감방 입장</h2>
            <form id="login-form" class="space-y-4" onsubmit="event.preventDefault(); window.doLogin();">
                <input type="text" id="nickname-input" required class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-5 py-4 text-center text-lg focus:ring-2 focus:ring-gray-900 outline-none font-bold text-gray-900" placeholder="닉네임 (예: 김작가)">
                <button type="submit" class="w-full py-4 bg-gray-900 text-white rounded-2xl font-bold text-lg hover:bg-gray-800 transition-colors shadow-lg cursor-pointer">입장하기</button>
            </form>
        </div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast-container" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-[60] hidden-safely transition-all duration-300">
        <div id="toast-message" class="bg-gray-900 text-white px-6 py-3 rounded-2xl shadow-2xl font-medium text-sm flex items-center gap-2"></div>
    </div>

    <!-- 헤더 -->
    <header class="glass-header sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gray-900 rounded-xl flex items-center justify-center text-white font-bold text-lg leading-none shadow-sm">M</div>
                <h1 class="text-lg font-bold tracking-tight text-gray-900">마감방</h1>
            </div>
            
            <nav class="hidden md:flex items-center gap-8">
                <button class="nav-btn text-gray-900 font-semibold border-b-2 border-gray-900 pb-1" data-target="tab-room">집필실</button>
                <button class="nav-btn text-gray-400 hover:text-gray-900 font-medium pb-1 transition-colors" data-target="tab-journal">개인 집필 일지</button>
                <button class="nav-btn text-gray-400 hover:text-gray-900 font-medium pb-1 transition-colors" data-target="tab-community">Log</button>
            </nav>

            <div class="flex items-center gap-3">
                <div id="auth-status" class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></div>
                <span id="user-info" class="text-xs text-gray-500 font-medium hidden md:block">연결 대기중...</span>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 w-full py-8">
        <!-- 탭 1: 집필실 -->
        <section id="tab-room" class="tab-content active space-y-8">
            <div class="bg-white rounded-3xl p-5 card-shadow border border-gray-100 flex flex-col sm:flex-row items-center gap-4">
                <span class="text-gray-500 font-bold whitespace-nowrap sm:pl-4">오늘의 목표</span>
                <input type="text" id="room-goal-input" class="flex-1 w-full bg-transparent border-none outline-none text-gray-900 px-2 text-center sm:text-left" placeholder="마감 목표를 한 줄로 적어주세요 (예: 15화 초고 완성)">
                <button id="btn-save-goal" class="w-full sm:w-auto px-6 py-2.5 bg-gray-900 text-white rounded-xl hover:bg-gray-800 transition-colors font-medium cursor-pointer">저장</button>
            </div>

            <div class="flex flex-col lg:flex-row gap-8">
                <!-- 화면 공유 영역 -->
                <div class="lg:w-2/3 space-y-6">
                    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-900">함께 마감하는 집필실</h2>
                            <p class="text-gray-500 text-sm mt-1">서로의 마감을 응원합니다</p>
                        </div>
                        
                        <div class="flex items-center gap-3 bg-white p-2 rounded-2xl shadow-sm border border-gray-100">
                            <label class="flex items-center gap-2 px-3 text-sm cursor-pointer text-gray-600 hover:text-gray-900">
                                <input type="checkbox" id="blur-toggle" class="w-4 h-4 rounded text-gray-900 focus:ring-gray-900" checked>
                                <span class="font-medium">모자이크</span>
                            </label>
                            <div class="w-px h-6 bg-gray-200"></div>
                            <button id="btn-cam" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl text-sm font-semibold cursor-pointer">웹캠</button>
                            <button id="btn-screen" class="px-4 py-2 bg-gray-900 hover:bg-gray-800 text-white rounded-xl text-sm font-semibold cursor-pointer">화면공유</button>
                            <button id="btn-stop" class="hidden-safely px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-xl text-sm font-semibold cursor-pointer">중지</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="video-grid">
                        <div class="bg-white rounded-3xl card-shadow border border-gray-100 overflow-hidden relative aspect-[4/3] flex items-center justify-center">
                            <!-- 내 비디오 -->
                            <video id="video-element" class="w-full h-full object-cover hidden-safely video-blur absolute inset-0 z-40" autoplay playsinline muted></video>
                            
                            <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-50 text-gray-400 z-10">
                                <div class="w-16 h-16 bg-white rounded-2xl shadow-sm flex items-center justify-center mb-4 text-gray-400 font-bold text-2xl">나</div>
                                <p class="text-sm font-medium">내 화면 대기중</p>
                            </div>

                            <div class="absolute top-4 left-4 bg-black/50 text-white text-xs px-3 py-1.5 rounded-full font-bold flex items-center gap-2 z-50">
                                <span id="live-indicator" class="w-2 h-2 rounded-full bg-red-500 hidden-safely animate-pulse"></span>
                                나 (<span class="daily-time-display">00:00:00</span>)
                            </div>
                        </div>
                        <div id="other-users-grid" class="contents"></div>
                    </div>
                </div>

                <!-- 타이머 영역 -->
                <div class="lg:w-1/3 flex flex-col gap-6">
                    <div class="bg-white rounded-3xl p-6 card-shadow border border-gray-100">
                        <h3 class="font-bold text-gray-900 mb-4">하루 2시간 챌린지</h3>
                        <div class="flex justify-between items-end mb-2">
                            <span class="text-2xl font-light text-gray-900 daily-time-display">00:00:00</span>
                            <span class="text-gray-400 text-sm font-medium" id="progress-percent">0%</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
                            <div id="progress-bar" class="bg-gray-900 h-full rounded-full transition-all duration-1000 w-0"></div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-8 card-shadow border border-gray-100 text-center relative overflow-hidden flex-1 flex flex-col justify-center min-h-[300px]">
                        <div class="absolute inset-0 bg-gray-50 origin-bottom transform scale-y-0 transition-transform duration-1000 ease-linear" id="pomo-bg-fill" style="z-index: 0;"></div>
                        
                        <div class="relative z-10">
                            <div class="flex justify-center gap-2 mb-8">
                                <button id="mode-work" class="px-4 py-1.5 rounded-full text-sm font-bold bg-gray-900 text-white shadow-md cursor-pointer">집중 25분</button>
                                <button id="mode-break" class="px-4 py-1.5 rounded-full text-sm font-bold text-gray-500 hover:bg-gray-100 cursor-pointer">휴식 5분</button>
                            </div>

                            <div class="text-6xl font-light tracking-tighter text-gray-900 mb-8 tabular-nums leading-none" id="pomo-display">25:00</div>

                            <div class="flex justify-center gap-3">
                                <button id="btn-pomo-start" class="w-28 py-3 bg-gray-900 hover:bg-gray-800 text-white rounded-2xl font-bold shadow-lg text-sm cursor-pointer">시작하기</button>
                                <button id="btn-pomo-reset" class="w-14 py-3 bg-white border-2 border-gray-100 text-gray-400 hover:text-gray-900 rounded-2xl flex items-center justify-center cursor-pointer">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 탭 2: 집필 일지 -->
        <section id="tab-journal" class="tab-content">
            <div class="flex flex-col lg:flex-row gap-8">
                <div class="lg:w-1/3">
                    <div class="sticky top-24 bg-white rounded-3xl p-8 card-shadow border border-gray-100">
                        <h2 class="text-xl font-bold text-gray-900 mb-6">오늘의 일지 작성</h2>
                        <form id="log-form" class="space-y-4">
                            <div><label class="block text-xs font-semibold text-gray-500 mb-2">날짜</label><input type="date" id="log-date" required class="w-full bg-gray-50 rounded-2xl px-5 py-3 outline-none text-sm"></div>
                            <div><label class="block text-xs font-semibold text-gray-500 mb-2">제목</label><input type="text" id="log-title" placeholder="어떤 작업을 하셨나요?" required class="w-full bg-gray-50 rounded-2xl px-5 py-3 outline-none text-sm"></div>
                            <div><label class="block text-xs font-semibold text-gray-500 mb-2">작업량</label><input type="number" id="log-count" placeholder="예: 5000" required class="w-full bg-gray-50 rounded-2xl px-5 py-3 outline-none text-sm"></div>
                            <div><label class="block text-xs font-semibold text-gray-500 mb-2">내용</label><textarea id="log-note" required rows="4" class="w-full bg-gray-50 rounded-2xl px-5 py-4 outline-none resize-none text-sm" placeholder="소감을 남겨주세요."></textarea></div>
                            <button type="submit" class="w-full py-4 bg-gray-900 text-white rounded-2xl font-bold cursor-pointer mt-2">일지에 저장</button>
                        </form>
                    </div>
                </div>
                <div class="lg:w-2/3"><div class="columns-1 sm:columns-2 gap-6 space-y-6" id="log-list"></div></div>
            </div>
        </section>

        <!-- 탭 3: 커뮤니티 -->
        <section id="tab-community" class="tab-content">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">동료 작가 마감 현황</h2>
            <div class="grid grid-cols-1 gap-6" id="community-list"></div>
        </section>
    </main>

    <!-- UI 및 탭 제어 스크립트 -->
    <script>
        window.myNickname = '';
        function showToast(msg) {
            var el = document.getElementById('toast-message'), container = document.getElementById('toast-container');
            if(el && container) { el.textContent = msg; container.classList.remove('hidden-safely'); setTimeout(() => container.classList.add('hidden-safely'), 3000); }
        }
        window.doLogin = function() {
            var input = document.getElementById('nickname-input');
            var val = input ? input.value.trim() : '';
            if (!val) return;
            window.myNickname = val;
            localStorage.setItem('deadline_room_nickname', val);
            document.getElementById('login-overlay').style.setProperty('display', 'none', 'important');
            document.body.classList.remove('overflow-hidden');
            window.dispatchEvent(new CustomEvent('init-app', { detail: val }));
        };
        document.addEventListener('DOMContentLoaded', () => {
            var navBtns = document.querySelectorAll('.nav-btn'), tabContents = document.querySelectorAll('.tab-content');
            navBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    navBtns.forEach(b => { b.classList.remove('text-gray-900', 'border-b-2', 'border-gray-900'); b.classList.add('text-gray-400'); });
                    tabContents.forEach(c => c.classList.remove('active'));
                    btn.classList.add('text-gray-900', 'border-b-2', 'border-gray-900');
                    btn.classList.remove('text-gray-400');
                    document.getElementById(btn.dataset.target).classList.add('active');
                    if (btn.dataset.target === 'tab-community' && window.renderCommunityLog) window.renderCommunityLog();
                });
            });
            var saved = localStorage.getItem('deadline_room_nickname');
            if (saved) { 
                var input = document.getElementById('nickname-input');
                if(input) input.value = saved; 
                window.doLogin(); 
            }
        });
    </script>

    <!-- Firebase 및 통신 모듈 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, updateDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCgNwW2-sWbwW_t3ql8Zkg4osAvR294_x4", authDomain: "deadline-room-768bf.firebaseapp.com", projectId: "deadline-room-768bf" };
        let app, auth, db, currentUser = null, publicUsers = [];
        let peer = null, myPeerId = null, currentCalls = {}, mediaStream = null, myNick = '';
        let dailySharedSeconds = 0, sharingInterval = null, lastTick = null; const GOAL_SECONDS = 2 * 60 * 60;

        const DB_COLLECTION = 'artifacts/app/users';

        window.addEventListener('init-app', (e) => { myNick = e.detail; initFirebase(); });

        async function initFirebase() {
            app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app);
            const cred = await signInAnonymously(auth); currentUser = cred.user;
            
            document.getElementById('auth-status').className = 'w-2 h-2 rounded-full bg-emerald-500';
            document.getElementById('user-info').textContent = `${myNick} (온라인)`;
            
            var logDate = document.getElementById('log-date');
            if(logDate) logDate.valueAsDate = new Date();
            
            /* Metered.ca TURN 서버 설정 */
            const customIceServers = [
                { urls: 'stun:stun.l.google.com:19302' },
                {
                    urls: 'turn:global.relay.metered.ca:80',
                    username: 'b3b66b02e8b3db0c7fb62dcd',
                    credential: 'UUa43LGXDD4OzNKa'
                },
                {
                    urls: 'turn:global.relay.metered.ca:443?transport=tcp',
                    username: 'b3b66b02e8b3db0c7fb62dcd',
                    credential: 'UUa43LGXDD4OzNKa'
                }
            ];

            peer = new Peer({ config: { iceServers: customIceServers } });
            
            peer.on('open', (id) => {
                myPeerId = id;
                initUserProfile();
            });

            peer.on('call', (call) => {
                call.answer(mediaStream || undefined);
                currentCalls[call.peer] = call;
                call.on('stream', (stream) => addRemoteVideo(call.peer, stream));
            });
            setupLogsListener();
        }

        async function initUserProfile() {
            const userRef = doc(db, DB_COLLECTION, myNick);
            const snap = await getDoc(userRef);
            
            if (!snap.exists()) {
                await setDoc(userRef, { id: myNick, nickname: myNick, peerId: myPeerId, goal: '', dailySeconds: 0, lastActive: serverTimestamp(), isOnline: true, isSharing: false });
            } else {
                await updateDoc(userRef, { peerId: myPeerId, isOnline: true, lastActive: serverTimestamp() });
                if (snap.data().goal) document.getElementById('room-goal-input').value = snap.data().goal;
                dailySharedSeconds = snap.data().dailySeconds || 0;
            }
            updateProgressUI();
            
            onSnapshot(collection(db, DB_COLLECTION), (snap) => {
                publicUsers = [];
                snap.forEach(d => {
                    const data = d.data();
                    if(data.id) publicUsers.push(data);
                });
                renderOtherUsers();
                checkAndCallOthers();
                if (document.getElementById('tab-community').classList.contains('active')) window.renderCommunityLog();
            });
        }

        function checkAndCallOthers() {
            if (!myPeerId || !peer) return;
            const others = publicUsers.filter(u => u.id !== myNick && u.isOnline && u.peerId);
            others.forEach(u => {
                if ((u.isSharing || mediaStream) && !currentCalls[u.peerId]) {
                    const call = mediaStream ? peer.call(u.peerId, mediaStream) : peer.call(u.peerId);
                    if (call) {
                        currentCalls[u.peerId] = call;
                        call.on('stream', (stream) => addRemoteVideo(u.peerId, stream));
                    }
                }
            });
        }

        const videoEl = document.getElementById('video-element'), placeholder = document.getElementById('video-placeholder');
        document.getElementById('blur-toggle').addEventListener('change', (e) => {
            e.target.checked ? videoEl.classList.add('video-blur') : videoEl.classList.remove('video-blur');
            document.querySelectorAll('.remote-video').forEach(v => e.target.checked ? v.classList.add('video-blur') : v.classList.remove('video-blur'));
        });

        async function startStream(type) {
            if (mediaStream) stopStream();
            try {
                mediaStream = await (type === 'cam' ? navigator.mediaDevices.getUserMedia({ video: true }) : navigator.mediaDevices.getDisplayMedia({ video: true }));
                videoEl.srcObject = mediaStream;
                videoEl.classList.remove('hidden-safely'); placeholder.classList.add('hidden-safely');
                document.getElementById('btn-cam').classList.add('hidden-safely'); document.getElementById('btn-screen').classList.add('hidden-safely');
                document.getElementById('btn-stop').classList.remove('hidden-safely'); document.getElementById('live-indicator').classList.remove('hidden-safely');
                
                mediaStream.getVideoTracks()[0].onended = stopStream;
                startTimeTracking(); showToast(type === 'cam' ? "웹캠 시작" : "화면 공유 시작");
                if (myNick) updateDoc(doc(db, DB_COLLECTION, myNick), { isSharing: true });
                checkAndCallOthers();
            } catch (err) { showToast("권한이 거부되었습니다."); }
        }

        function stopStream() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
            videoEl.classList.add('hidden-safely'); placeholder.classList.remove('hidden-safely');
            document.getElementById('btn-cam').classList.remove('hidden-safely'); document.getElementById('btn-screen').classList.remove('hidden-safely');
            document.getElementById('btn-stop').classList.add('hidden-safely'); document.getElementById('live-indicator').classList.add('hidden-safely');
            
            if (myNick) updateDoc(doc(db, DB_COLLECTION, myNick), { isSharing: false });
            Object.values(currentCalls).forEach(c => c.close()); currentCalls = {};
            stopTimeTracking();
        }

        document.getElementById('btn-cam').onclick = () => startStream('cam');
        document.getElementById('btn-screen').onclick = () => startStream('screen');
        document.getElementById('btn-stop').onclick = stopStream;

        function renderOtherUsers() {
            const grid = document.getElementById('other-users-grid');
            const others = publicUsers.filter(u => u.id !== myNick && u.isOnline);
            
            others.forEach(u => {
                const safeId = 'card_' + encodeURIComponent(u.id).replace(/%/g, '_');
                let card = document.getElementById(safeId);
                const h = Math.floor((u.dailySeconds || 0) / 3600), m = Math.floor(((u.dailySeconds || 0) % 3600) / 60).toString().padStart(2, '0');
                
                if (!card) {
                    card = document.createElement('div'); card.id = safeId;
                    card.className = "bg-white rounded-3xl card-shadow border border-gray-100 overflow-hidden relative aspect-[4/3] group flex items-center justify-center";
                    card.innerHTML = `
                        <div class="ui-layer absolute inset-0 flex flex-col justify-center items-center bg-gray-50 z-10">
                            <div class="w-16 h-16 bg-white rounded-2xl shadow-sm flex items-center justify-center text-gray-400 font-bold text-2xl mb-4">${u.id.charAt(0)}</div>
                            <p class="text-base font-bold text-gray-900">${u.id}</p>
                            <p class="text-sm text-gray-500 mt-1">${u.goal || '목표 없음'}</p>
                        </div>
                        <div class="absolute top-4 left-4 bg-black/50 text-white text-xs px-3 py-1.5 rounded-full font-bold flex items-center gap-1.5 z-50">
                            <span class="w-1.5 h-1.5 rounded-full status-dot ${u.isSharing ? 'bg-emerald-400 animate-pulse' : 'bg-gray-400'}"></span>
                            ${u.id} (<span class="time-text">${h}h ${m}m</span>)
                        </div>`;
                    grid.appendChild(card);
                } else {
                    card.querySelector('.time-text').textContent = `${h}h ${m}m`;
                    card.querySelector('.status-dot').className = `w-1.5 h-1.5 rounded-full status-dot ${u.isSharing ? 'bg-emerald-400 animate-pulse' : 'bg-gray-400'}`;
                }
            });
            Array.from(grid.children).forEach(c => { if (!others.find(u => 'card_' + encodeURIComponent(u.id).replace(/%/g, '_') === c.id)) c.remove(); });
        }

        function addRemoteVideo(incomingId, stream) {
            if(!stream || stream.getVideoTracks().length === 0) return;
            const user = publicUsers.find(u => u.peerId === incomingId);
            if(!user) return;
            
            const card = document.getElementById('card_' + encodeURIComponent(user.id).replace(/%/g, '_'));
            if(!card) return;
            const layer = card.querySelector('.ui-layer'); if(layer) layer.style.display = 'none';

            let vid = card.querySelector('video.remote-video');
            if(!vid) {
                vid = document.createElement('video');
                vid.className = `remote-video absolute inset-0 w-full h-full object-cover z-40 ${document.getElementById('blur-toggle').checked ? 'video-blur' : ''}`;
                vid.autoplay = true; vid.playsinline = true; vid.muted = true;
                card.appendChild(vid);
            }
            if(vid.srcObject !== stream) vid.srcObject = stream;
        }

        function startTimeTracking() {
            if (sharingInterval) return;
            lastTick = Date.now();
            sharingInterval = setInterval(() => {
                const delta = Math.floor((Date.now() - lastTick) / 1000);
                if (delta > 0) {
                    dailySharedSeconds += delta; lastTick += delta * 1000; updateProgressUI();
                    if (dailySharedSeconds % 10 === 0 && myNick) updateDoc(doc(db, DB_COLLECTION, myNick), { dailySeconds: dailySharedSeconds });
                }
            }, 1000);
        }
        function stopTimeTracking() { if (sharingInterval) clearInterval(sharingInterval); sharingInterval = null; }
        function updateProgressUI() {
            const h = Math.floor(dailySharedSeconds / 3600).toString().padStart(2, '0'), m = Math.floor((dailySharedSeconds % 3600) / 60).toString().padStart(2, '0'), s = (dailySharedSeconds % 60).toString().padStart(2, '0');
            document.querySelectorAll('.daily-time-display').forEach(el => el.textContent = `${h}:${m}:${s}`);
            const percent = Math.min((dailySharedSeconds / GOAL_SECONDS) * 100, 100);
            document.getElementById('progress-bar').style.width = `${percent}%`; document.getElementById('progress-percent').textContent = `${Math.floor(percent)}%`;
        }

        document.getElementById('btn-save-goal').onclick = () => {
            if (myNick) updateDoc(doc(db, DB_COLLECTION, myNick), { goal: document.getElementById('room-goal-input').value });
            showToast("목표 저장 완료");
        };

        const POMO_WORK = 25 * 60, POMO_BREAK = 5 * 60; let pomoSec = POMO_WORK, isPomoRun = false, pomoInt = null, pomoMode = 'work';
        const display = document.getElementById('pomo-display'), fill = document.getElementById('pomo-bg-fill');
        function setPomo(mode) {
            if(isPomoRun) togglePomo(); pomoMode = mode; pomoSec = mode === 'work' ? POMO_WORK : POMO_BREAK;
            document.getElementById('mode-work').className = mode === 'work' ? 'px-4 py-1.5 rounded-full text-sm font-bold bg-gray-900 text-white shadow-md' : 'px-4 py-1.5 rounded-full text-sm font-bold text-gray-500 hover:bg-gray-100';
            document.getElementById('mode-break').className = mode === 'break' ? 'px-4 py-1.5 rounded-full text-sm font-bold bg-gray-900 text-white shadow-md' : 'px-4 py-1.5 rounded-full text-sm font-bold text-gray-500 hover:bg-gray-100';
            updatePomo();
        }
        function updatePomo() {
            display.textContent = `${Math.floor(pomoSec / 60).toString().padStart(2, '0')}:${(pomoSec % 60).toString().padStart(2, '0')}`;
            const total = pomoMode === 'work' ? POMO_WORK : POMO_BREAK; fill.style.transform = `scaleY(${((total - pomoSec) / total)})`;
            fill.className = `absolute inset-0 origin-bottom transform scale-y-0 transition-transform duration-1000 ease-linear ${pomoMode === 'work' ? 'bg-gray-50' : 'bg-green-50'}`;
        }
        function togglePomo() {
            if (isPomoRun) { clearInterval(pomoInt); isPomoRun = false; document.getElementById('btn-pomo-start').textContent = "계속하기"; }
            else {
                isPomoRun = true; document.getElementById('btn-pomo-start').textContent = "일시정지";
                pomoInt = setInterval(() => { if (pomoSec > 0) { pomoSec--; updatePomo(); } else { showToast(pomoMode === 'work' ? "휴식!" : "집중!"); setPomo(pomoMode === 'work' ? 'break' : 'work'); } }, 1000);
            }
        }
        document.getElementById('mode-work').onclick = () => setPomo('work'); document.getElementById('mode-break').onclick = () => setPomo('break');
        document.getElementById('btn-pomo-start').onclick = togglePomo; document.getElementById('btn-pomo-reset').onclick = () => setPomo(pomoMode);

        function setupLogsListener() {
            onSnapshot(query(collection(db, DB_COLLECTION, myNick, 'logs')), (snap) => {
                const logs = []; snap.forEach(d => logs.push({ id: d.id, ...d.data() })); logs.sort((a, b) => b.timestamp - a.timestamp);
                document.getElementById('log-list').innerHTML = logs.map(l => `<div class="bg-white rounded-3xl p-6 card-shadow border border-gray-100 mb-6 w-full"><div class="flex justify-between items-start mb-2"><h3 class="text-lg font-bold text-gray-900">${l.title}</h3><span class="text-xs font-medium text-gray-400 bg-gray-50 px-2 py-1 rounded-md">${l.date}</span></div><div class="mb-4"><span class="bg-gray-100 text-gray-800 text-xs font-bold px-3 py-1.5 rounded-xl">${l.count}자</span></div><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">${l.note}</p></div>`).join('') || '<div class="text-gray-400 text-sm py-4">일지가 없습니다.</div>';
            });
        }
        document.getElementById('log-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, DB_COLLECTION, myNick, 'logs'), { date: document.getElementById('log-date').value, title: document.getElementById('log-title').value, count: parseInt(document.getElementById('log-count').value), note: document.getElementById('log-note').value, timestamp: Date.now() });
            e.target.reset(); showToast("저장 완료");
        };

        window.renderCommunityLog = function() {
            document.getElementById('community-list').innerHTML = publicUsers.map(u => {
                const h = Math.floor((u.dailySeconds || 0) / 3600), m = Math.floor(((u.dailySeconds || 0) % 3600) / 60), progress = Math.min(((u.dailySeconds || 0) / GOAL_SECONDS) * 100, 100);
                return `<div class="rounded-3xl p-6 card-shadow border border-gray-100 ${u.id === myNick ? 'bg-indigo-50/30' : 'bg-white'} flex items-center justify-between gap-8"><div class="flex items-center gap-5"><div class="w-16 h-16 rounded-2xl bg-white shadow-sm border border-gray-100 flex items-center justify-center font-bold text-2xl">${u.id.charAt(0)}</div><div class="font-bold text-xl">${u.id}</div></div><div class="flex-1"><div class="flex justify-between text-xs font-bold text-gray-500 mb-2"><span>오늘 작업 (${h}h ${m}m)</span><span>${Math.floor(progress)}%</span></div><div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden"><div class="h-full bg-emerald-500 rounded-full" style="width: ${progress}%"></div></div></div></div>`;
            }).join('') || '<div class="text-gray-400 py-10">참여자가 없습니다.</div>';
        };

        window.addEventListener('beforeunload', () => { if (myNick) updateDoc(doc(db, DB_COLLECTION, myNick), { isOnline: false, isSharing: false, lastActive: serverTimestamp() }); });
    </script>
</body>
</html>
