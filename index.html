<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마감방 - 웹소설 작가 작업실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face {
            font-family: 'LeeSeoyun';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/LeeSeoyun.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        body { font-family: 'LeeSeoyun', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #FAFAFA; color: #111827; font-size: 1.05rem; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }

        .card-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.03); }
        
        .tab-content { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .tab-content.active { display: block; opacity: 1; }
        
        .video-blur { filter: blur(4px) brightness(0.95); }
        .hidden-safely { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-gray-200 overflow-hidden">

    <!-- 로그인 오버레이 -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-900/60 backdrop-blur-md z-50 flex items-center justify-center">
        <div class="bg-white rounded-3xl p-8 card-shadow max-w-md w-full mx-4 text-center">
            <div class="w-16 h-16 bg-gray-900 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-3xl mb-4 shadow-sm">M</div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">마감방 입장</h2>
            <form id="login-form" class="space-y-4" onsubmit="event.preventDefault(); window.doLogin();">
                <input type="text" id="nickname-input" required class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-5 py-4 text-center text-lg focus:ring-2 focus:ring-gray-900 outline-none font-bold text-gray-900" placeholder="닉네임 (예: 김작가)">
                <button type="submit" class="w-full py-4 bg-gray-900 text-white rounded-2xl font-bold text-lg hover:bg-gray-800 transition-colors shadow-lg cursor-pointer">입장하기</button>
            </form>
        </div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast-container" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-[60] hidden-safely transition-all duration-300">
        <div id="toast-message" class="bg-gray-900 text-white px-6 py-3 rounded-2xl shadow-2xl font-medium text-sm flex items-center gap-2"></div>
    </div>

    <!-- 헤더 -->
    <header class="glass-header sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gray-900 rounded-xl flex items-center justify-center text-white font-bold text-lg leading-none shadow-sm">M</div>
                <h1 class="text-lg font-bold tracking-tight text-gray-900">마감방</h1>
            </div>
            
            <nav class="hidden md:flex items-center gap-8">
                <button class="nav-btn text-gray-900 font-semibold border-b-2 border-gray-900 pb-1" data-target="tab-room">집필실</button>
                <button class="nav-btn text-gray-400 hover:text-gray-900 font-medium pb-1 transition-colors" data-target="tab-journal">개인 집필 일지</button>
                <button class="nav-btn text-gray-400 hover:text-gray-900 font-medium pb-1 transition-colors" data-target="tab-community">Log</button>
            </nav>

            <div class="flex items-center gap-3">
                <div id="auth-status" class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></div>
                <span id="user-info" class="text-xs text-gray-500 font-medium hidden md:block">연결 대기중...</span>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 w-full py-8">
        <!-- 탭 1: 집필실 -->
        <section id="tab-room" class="tab-content active space-y-8">
            <div class="bg-white rounded-3xl p-5 card-shadow border border-gray-100 flex flex-col sm:flex-row items-center gap-4">
                <span class="text-gray-500 font-bold whitespace-nowrap sm:pl-4">오늘의 목표</span>
                <input type="text" id="
