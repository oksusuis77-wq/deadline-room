<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마감방 - 웹소설 작가 작업실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face {
            font-family: 'LeeSeoyun';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/LeeSeoyun.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        body { font-family: 'LeeSeoyun', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #FAFAFA; color: #111827; font-size: 1.15rem; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }

        .card-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.03); }
        
        .tab-content { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .tab-content.active { display: block; opacity: 1; }
        
        .video-blur { filter: blur(4px) brightness(0.95); }
        .hidden-safely { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-gray-200 overflow-hidden">

    <!-- 로그인 오버레이 -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-900/60 backdrop-blur-md z-50 flex items-center justify-center">
        <div class="bg-white rounded-3xl p-8 card-shadow max-w-md w-full mx-4 text-center">
            <div class="w-16 h-16 bg-gray-900 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-3xl mb-4 shadow-sm">M</div>
            <h2 class="text-3xl font-bold text-gray-900 mb-2">마감방 입장</h2>
            <div class="space-y-4">
                <input type="text" id="nickname-input" required class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-5 py-4 text-center text-xl focus:ring-2 focus:ring-gray-900 outline-none font-bold text-gray-900" placeholder="닉네임 (예: 김작가)" onkeyup="if(event.key==='Enter') window.doLogin()">
                <button type="button" onclick="window.doLogin()" class="w-full py-4 bg-gray-900 text-white rounded-2xl font-bold text-xl hover:bg-gray-800 transition-colors shadow-lg cursor-pointer">입장하기</button>
            </div>
        </div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast-container" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-[60] hidden-safely transition-all duration-300">
        <div id="toast-message" class="bg-gray-900 text-white px-6 py-3 rounded-2xl shadow-2xl font-medium text-base flex items-center gap-2"></div>
    </div>

    <!-- 헤더 -->
    <header class="glass-header sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gray-900 rounded-xl flex items-center justify-center text-white font-bold text-xl leading-none shadow-sm">M</div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">마감방</h1>
            </div>
            
            <nav class="hidden md:flex items-center gap-10 text-lg">
                <button class="nav-btn text-gray-900 font-bold border-b-2 border-gray-900 pb-1" data-target="tab-room">집필실</button>
                <button class="nav-btn text-gray-400 hover:text-gray-900 font-bold pb-1 transition-colors" data-target="tab-community">Log</button>
            </nav>

            <div class="flex items-center gap-3">
                <div id="auth-status" class="w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse"></div>
                <span id="user-info" class="text-sm text-gray-600 font-bold hidden md:block">연결 대기중...</span>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 w-full py-8">
        <!-- 탭 1: 집필실 -->
        <section id="tab-room" class="tab-content active space-y-8">
            <div class="bg-white rounded-3xl p-6 card-shadow border border-gray-100 flex flex-col sm:flex-row items-center gap-4">
                <span class="text-gray-700 font-bold text-lg whitespace-nowrap sm:pl-2">오늘의 목표</span>
                <input type="text" id="room-goal-input" class="flex-1 w-full bg-transparent border-none outline-none text-gray-900 px-2 text-center sm:text-left text-lg font-medium" placeholder="마감 목표를 한 줄로 적어주세요 (예: 15화 초고 완성)">
                <button id="btn-save-goal" class="w-full sm:w-auto px-8 py-3 bg-gray-900 text-white rounded-2xl hover:bg-gray-800 transition-colors font-bold cursor-pointer text-base">저장</button>
            </div>

            <div class="flex flex-col lg:flex-row gap-8">
                <!-- 화면 공유 영역 -->
                <div class="lg:w-2/3 space-y-6">
                    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                        <div>
                            <h2 class="text-3xl font-bold text-gray-900">함께 마감하는 집필실</h2>
                            <p class="text-gray-500 text-base mt-1">서로의 마감을 응원합니다</p>
                        </div>
                        
                        <div class="flex items-center gap-3 bg-white p-2.5 rounded-2xl shadow-sm border border-gray-100">
                            <label class="flex items-center gap-2 px-3 text-base cursor-pointer text-gray-700 hover:text-gray-900">
                                <input type="checkbox" id="blur-toggle" class="w-4 h-4 rounded text-gray-900 focus:ring-gray-900" checked>
                                <span class="font-bold">모자이크</span>
                            </label>
                            <div class="w-px h-6 bg-gray-200"></div>
                            <button id="btn-cam" onclick="window.startStream('cam')" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl text-base font-bold cursor-pointer">웹캠</button>
                            <button id="btn-screen" onclick="window.startStream('screen')" class="px-5 py-2.5 bg-gray-900 hover:bg-gray-800 text-white rounded-xl text-base font-bold cursor-pointer">화면공유</button>
                            <button id="btn-stop" onclick="window.stopStream()" class="hidden-safely px-5 py-2.5 bg-red-50 text-red-600 hover:bg-red-100 rounded-xl text-base font-bold cursor-pointer">중지</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="video-grid">
                        <div class="bg-white rounded-3xl card-shadow border border-gray-100 overflow-hidden relative aspect-[4/3] flex items-center justify-center">
                            <!-- 내 비디오 -->
                            <video id="video-element" class="w-full h-full object-cover hidden-safely video-blur absolute inset-0 z-40" autoplay playsinline muted></video>
                            
                            <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-50 text-gray-400 z-10">
                                <div class="w-20 h-20 bg-white rounded-3xl shadow-sm flex items-center justify-center mb-4 text-gray-400 font-bold text-3xl">나</div>
                                <p class="text-base font-bold text-gray-400">내 화면 대기중</p>
                            </div>

                            <div class="absolute top-4 left-4 bg-black/60 text-white text-sm px-4 py-2 rounded-full font-bold flex items-center gap-2 z-50">
                                <span id="live-indicator" class="w-2 h-2 rounded-full bg-red-500 hidden-safely animate-pulse"></span>
                                나 (<span class="daily-time-display">00:00:00</span>)
                            </div>
                        </div>
                        <div id="other-users-grid" class="contents"></div>
                    </div>
                </div>

                <!-- 타이머 영역 -->
                <div class="lg:w-1/3 flex flex-col gap-6">
                    <div class="bg-white rounded-3xl p-6 card-shadow border border-gray-100">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-xl text-gray-900">하루 2시간 챌린지</h3>
                            <span class="text-xs font-bold text-gray-400 bg-gray-50 px-2.5 py-1 rounded-lg">매일 AM 03:00 리셋</span>
                        </div>
                        <div class="flex justify-between items-end mb-2">
                            <span class="text-3xl font-light text-gray-900 daily-time-display">00:00:00</span>
                            <span class="text-gray-400 text-base font-bold" id="progress-percent">0%</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
                            <div id="progress-bar" class="bg-gray-900 h-full rounded-full transition-all duration-1000 w-0"></div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-8 card-shadow border border-gray-100 text-center relative overflow-hidden flex-1 flex flex-col justify-center min-h-[320px]">
                        <div class="absolute inset-0 bg-gray-50 origin-bottom transform scale-y-0 transition-transform duration-1000 ease-linear" id="pomo-bg-fill" style="z-index: 0;"></div>
                        
                        <div class="relative z-10">
                            <div class="flex justify-center gap-3 mb-8">
                                <button id="mode-work" class="px-5 py-2 rounded-full text-base font-bold bg-gray-900 text-white shadow-md cursor-pointer">집중 25분</button>
                                <button id="mode-break" class="px-5 py-2 rounded-full text-base font-bold text-gray-500 hover:bg-gray-100 cursor-pointer">휴식 5분</button>
                            </div>

                            <div class="text-7xl font-light tracking-tighter text-gray-900 mb-8 tabular-nums leading-none" id="pomo-display">25:00</div>

                            <div class="flex justify-center gap-3">
                                <button id="btn-pomo-start" class="w-32 py-3.5 bg-gray-900 hover:bg-gray-800 text-white rounded-2xl font-bold shadow-lg text-base cursor-pointer">시작하기</button>
                                <button id="btn-pomo-reset" class="w-16 py-3.5 bg-white border-2 border-gray-100 text-gray-400 hover:text-gray-900 rounded-2xl flex items-center justify-center cursor-pointer">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 탭 2: Log -->
        <section id="tab-community" class="tab-content space-y-8">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-end gap-6">
                <div>
                    <h2 class="text-3xl font-bold text-gray-900">동료 작가 마감 현황</h2>
                    <p class="text-gray-500 text-base mt-1">서로의 마감을 응원합니다 (매일 오전 3시 리셋)</p>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-gray-100 card-shadow text-base text-gray-600">
                    <h4 class="font-bold text-gray-900 mb-3 flex items-center gap-2 text-lg">
                        <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        마감방 규칙
                    </h4>
                    <ul class="space-y-2 text-sm">
                        <li class="flex items-start gap-2"><span class="text-gray-400">•</span> 주 5일 이상, 하루 2시간 이상 작업 필수</li>
                        <li class="flex items-start gap-2"><span class="text-gray-400">•</span> 미달성 시 하트 1개 감소 (생명 3개 차감 시 퇴출)</li>
                    </ul>
                </div>
            </div>

            <!-- 개별 작가 카드 리스트 -->
            <div class="grid grid-cols-1 gap-8" id="community-list"></div>

            <!-- 하단: 작가별 한 달 결산 리포트 섹션 -->
            <div class="bg-white rounded-3xl p-8 card-shadow border border-gray-100 space-y-6 mt-12">
                <div class="flex items-center justify-between border-b border-gray-100 pb-4">
                    <h3 class="text-2xl font-bold text-gray-900 flex items-center gap-3">
                        <span>📊</span> 작가별 이번 달 결산 리포트
                    </h3>
                    <span class="text-sm font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-xl" id="month-label">10월 현황</span>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="monthly-author-grid"></div>
            </div>
        </section>
    </main>

    <!-- UI 및 탭 제어 스크립트 -->
    <script>
        window.myNickname = '';
        function showToast(msg) {
            var el = document.getElementById('toast-message'), container = document.getElementById('toast-container');
            if(el && container) { el.textContent = msg; container.classList.remove('hidden-safely'); setTimeout(() => container.classList.add('hidden-safely'), 3000); }
        }
        window.doLogin = function() {
            var input = document.getElementById('nickname-input');
            var val = input ? input.value.trim() : '';
            if (!val) return;
            window.myNickname = val;
            localStorage.setItem('deadline_room_nickname', val);
            document.getElementById('login-overlay').style.setProperty('display', 'none', 'important');
            document.body.classList.remove('overflow-hidden');
            window.dispatchEvent(new CustomEvent('init-app', { detail: val }));
        };
        document.addEventListener('DOMContentLoaded', () => {
            var navBtns = document.querySelectorAll('.nav-btn'), tabContents = document.querySelectorAll('.tab-content');
            navBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    navBtns.forEach(b => { b.classList.remove('text-gray-900', 'border-b-2', 'border-gray-900'); b.classList.add('text-gray-400'); });
                    tabContents.forEach(c => c.classList.remove('active'));
                    btn.classList.add('text-gray-900', 'border-b-2', 'border-gray-900');
                    btn.classList.remove('text-gray-400');
                    document.getElementById(btn.dataset.target).classList.add('active');
                    if (btn.dataset.target === 'tab-community' && window.renderCommunityLog) window.renderCommunityLog();
                });
            });
            var saved = localStorage.getItem('deadline_room_nickname');
            if (saved) { 
                var input = document.getElementById('nickname-input');
                if(input) input.value = saved; 
                window.doLogin(); 
            }
        });
    </script>

    <!-- Firebase 및 통신 모듈 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCgNwW2-sWbwW_t3ql8Zkg4osAvR294_x4", authDomain: "deadline-room-768bf.firebaseapp.com", projectId: "deadline-room-768bf" };
        let app, auth, db, currentUser = null, publicUsers = [];
        let peer = null, myPeerId = null, currentCalls = {}, mediaStream = null, myNick = '';
        let dailySharedSeconds = 0, totalSharedSeconds = 0, sharingInterval = null, lastTick = null; 
        const GOAL_SECONDS = 2 * 60 * 60;
        let lastResetDateStr = '';

        const DB_COLLECTION = 'artifacts/app/users';

        function get3AMDateString(dateObj = new Date()) {
            const d = new Date(dateObj);
            d.setHours(d.getHours() - 3);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function get3AMDayIndex(dateObj = new Date()) {
            const d = new Date(dateObj);
            d.setHours(d.getHours() - 3);
            const day = d.getDay(); 
            return day === 0 ? 6 : day - 1; 
        }

        window.addEventListener('init-app', (e) => { myNick = e.detail; initFirebase(); });

        async function initFirebase() {
            app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app);
            const cred = await signInAnonymously(auth); currentUser = cred.user;
            
            document.getElementById('auth-status').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
            document.getElementById('user-info').textContent = `${myNick} (온라인)`;
            
            const customIceServers = [
                { urls: 'stun:stun.l.google.com:19302' },
                {
                    urls: 'turn:global.relay.metered.ca:80',
                    username: 'b3b66b02e8b3db0c7fb62dcd',
                    credential: 'UUa43LGXDD4OzNKa'
                },
                {
                    urls: 'turn:global.relay.metered.ca:443?transport=tcp',
                    username: 'b3b66b02e8b3db0c7fb62dcd',
                    credential: 'UUa43LGXDD4OzNKa'
                }
            ];

            peer = new Peer({ config: { iceServers: customIceServers } });
            
            peer.on('open', (id) => {
                myPeerId = id;
                initUserProfile();
            });

            peer.on('call', (call) => {
                call.answer(mediaStream || undefined);
                currentCalls[call.peer] = call;
                call.on('stream', (stream) => addRemoteVideo(call.peer, stream));
            });
        }

        async function initUserProfile() {
            const userRef = doc(db, DB_COLLECTION, myNick);
            const snap = await getDoc(userRef);
            const today3AM = get3AMDateString();
            
            if (!snap.exists()) {
                await setDoc(userRef, { 
                    id: myNick, nickname: myNick, peerId: myPeerId, goal: '', goalHistory: [],
                    dailySeconds: 0, totalSeconds: 0, warnings: 0, 
                    lastResetDate: today3AM,
                    weeklyLogs: { mon: true, tue: true, wed: true, thu: true, fri: false, sat: false, sun: false },
                    lastActive: serverTimestamp(), isOnline: true, isSharing: false 
                });
                lastResetDateStr = today3AM;
            } else {
                const data = snap.data();
                lastResetDateStr = data.lastResetDate || today3AM;
                
                if (lastResetDateStr !== today3AM) {
                    dailySharedSeconds = 0;
                    lastResetDateStr = today3AM;
                    await updateDoc(userRef, { 
                        peerId: myPeerId, isOnline: true, 
                        dailySeconds: 0, lastResetDate: today3AM, 
                        lastActive: serverTimestamp() 
                    });
                } else {
                    dailySharedSeconds = data.dailySeconds || 0;
                    await updateDoc(userRef, { peerId: myPeerId, isOnline: true, lastActive: serverTimestamp() });
                }
                
                if (data.goal) document.getElementById('room-goal-input').value = data.goal;
                totalSharedSeconds = data.totalSeconds || dailySharedSeconds;
            }
            updateProgressUI();
            
            onSnapshot(collection(db, DB_COLLECTION), (snap) => {
                publicUsers = [];
                snap.forEach(d => {
                    const data = d.data();
                    if(data.id) publicUsers.push(data);
                });
                renderOtherUsers();
                checkAndCallOthers();
                if (document.getElementById('tab-community').classList.contains('active')) window.renderCommunityLog();
            });
        }

        function checkAndCallOthers() {
            if (!myPeerId || !peer) return;
            const others = publicUsers.filter(u => u.id !== myNick && u.isOnline && u.peerId);
            others.forEach(u => {
                if ((u.isSharing || mediaStream) && !currentCalls[u.peerId]) {
                    const call = mediaStream ? peer.call(u.peerId, mediaStream) : peer.call(u.peerId);
                    if (call) {
                        currentCalls[u.peerId] = call;
                        call.on('stream', (stream) => addRemoteVideo(u.peerId, stream));
                    }
                }
            });
        }

        const videoEl = document.getElementById('video-element'), placeholder = document.getElementById('video-placeholder');
        document.getElementById('blur-toggle').addEventListener('change', (e) => {
            e.target.checked ? videoEl.classList.add('video-blur') : videoEl.classList.remove('video-blur');
            document.querySelectorAll('.remote-video').forEach(v => e.target.checked ? v.classList.add('video-blur') : v.classList.remove('video-blur'));
        });

        window.startStream = async function(type) {
            if (mediaStream) window.stopStream();
            try {
                mediaStream = await (type === 'cam' ? navigator.mediaDevices.getUserMedia({ video: true }) : navigator.mediaDevices.getDisplayMedia({ video: true }));
                videoEl.srcObject = mediaStream;
                videoEl.classList.remove('hidden-safely'); placeholder.classList.add('hidden-safely');
                document.getElementById('btn-cam').classList.add('hidden-safely'); document.getElementById('btn-screen').classList.add('hidden-safely');
                document.getElementById('btn-stop').classList.remove('hidden-safely'); document.getElementById('live-indicator').classList.remove('hidden-safely');
                
                mediaStream.getVideoTracks()[0].onended = window.stopStream;
                startTimeTracking(); showToast(type === 'cam' ? "웹캠 시작" : "화면 공유 시작");
                if (myNick) updateDoc(doc(db, DB_COLLECTION, myNick), { isSharing: true });
                
                Object.values(currentCalls).forEach(c => c.close());
                currentCalls = {};
                checkAndCallOthers();
            } catch (err) { showToast("권한이 거부되었습니다."); }
        };

        window.stopStream = function() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            videoEl.classList.add('hidden-safely'); placeholder.classList.remove('hidden-safely');
            document.getElementById('btn-cam').classList.remove('hidden-safely'); document.getElementById('btn-screen').classList.remove('hidden-safely');
            document.getElementById('btn-stop').classList.add('hidden-safely'); document.getElementById('live-indicator').classList.add('hidden-safely');
            
            if (myNick) updateDoc(doc(db, DB_COLLECTION, myNick), { isSharing: false });
            stopTimeTracking();
        };

        function renderOtherUsers() {
            const grid = document.getElementById('other-users-grid');
            const others = publicUsers.filter(u => u.id !== myNick && u.isOnline);
            
            others.forEach(u => {
                const safeId = 'card_' + encodeURIComponent(u.id).replace(/%/g, '_');
                let card = document.getElementById(safeId);
                const h = Math.floor((u.dailySeconds || 0) / 3600), m = Math.floor(((u.dailySeconds || 0) % 3600) / 60).toString().padStart(2, '0');
                
                if (!card) {
                    card = document.createElement('div'); card.id = safeId;
                    card.className = "bg-white rounded-3xl card-shadow border border-gray-100 overflow-hidden relative aspect-[4/3] group flex items-center justify-center";
                    card.innerHTML = `
                        <div class="ui-layer absolute inset-0 flex flex-col justify-center items-center bg-gray-50 z-10">
                            <div class="w-20 h-20 bg-white rounded-3xl shadow-sm flex items-center justify-center text-gray-400 font-bold text-3xl mb-4">${u.id.charAt(0)}</div>
                            <p class="text-xl font-bold text-gray-900">${u.id}</p>
                            <p class="text-base text-gray-500 mt-1 goal-text">${u.goal || '목표 없음'}</p>
                        </div>
                        <div class="absolute top-4 left-4 bg-black/60 text-white text-sm px-4 py-2 rounded-full font-bold flex items-center gap-2 z-50">
                            <span class="w-2 h-2 rounded-full status-dot ${u.isSharing ? 'bg-emerald-400 animate-pulse' : 'bg-gray-400'}"></span>
                            ${u.id} (<span class="time-text">${h}h ${m}m</span>)
                        </div>`;
                    grid.appendChild(card);
                } else {
                    card.querySelector('.time-text').textContent = `${h}h ${m}m`;
                    card.querySelector('.goal-text').textContent = u.goal || '목표 없음';
                    card.querySelector('.status-dot').className = `w-2 h-2 rounded-full status-dot ${u.isSharing ? 'bg-emerald-400 animate-pulse' : 'bg-gray-400'}`;
                    
                    const layer = card.querySelector('.ui-layer');
                    const vid = card.querySelector('video.remote-video');
                    if (!u.isSharing) {
                        if (vid) vid.remove();
                        if (layer) layer.style.display = 'flex';
                    }
                }
            });
            Array.from(grid.children).forEach(c => { if (!others.find(u => 'card_' + encodeURIComponent(u.id).replace(/%/g, '_') === c.id)) c.remove(); });
        }

        function addRemoteVideo(incomingId, stream) {
            if(!stream || stream.getVideoTracks().length === 0) return;
            const user = publicUsers.find(u => u.peerId === incomingId);
            if(!user || !user.isSharing) return;
            
            const card = document.getElementById('card_' + encodeURIComponent(user.id).replace(/%/g, '_'));
            if(!card) return;
            const layer = card.querySelector('.ui-layer'); if(layer) layer.style.display = 'none';

            let vid = card.querySelector('video.remote-video');
            if(!vid) {
                vid = document.createElement('video');
                vid.className = `remote-video absolute inset-0 w-full h-full object-cover z-40 ${document.getElementById('blur-toggle').checked ? 'video-blur' : ''}`;
                vid.autoplay = true; vid.playsinline = true; vid.muted = true;
                card.appendChild(vid);
            }
            if(vid.srcObject !== stream) vid.srcObject = stream;
        }

        function startTimeTracking() {
            if (sharingInterval) return;
            lastTick = Date.now();
            sharingInterval = setInterval(() => {
                const now = Date.now();
                const current3AM = get3AMDateString(new Date(now));
                
                if (lastResetDateStr && lastResetDateStr !== current3AM) {
                    dailySharedSeconds = 0;
                    lastResetDateStr = current3AM;
                    showToast("오전 3시 기준 당일 카운터가 리셋되었습니다.");
                    if (myNick) {
                        updateDoc(doc(db, DB_COLLECTION, myNick), { 
                            dailySeconds: 0, 
                            lastResetDate: current3AM 
                        });
                    }
                }

                const delta = Math.floor((now - lastTick) / 1000);
                if (delta > 0) {
                    dailySharedSeconds += delta; 
                    totalSharedSeconds += delta;
                    lastTick += delta * 1000; 
                    updateProgressUI();
                    if (dailySharedSeconds % 10 === 0 && myNick) {
                        updateDoc(doc(db, DB_COLLECTION, myNick), { 
                            dailySeconds: dailySharedSeconds,
                            totalSeconds: totalSharedSeconds 
                        });
                    }
                }
            }, 1000);
        }
        function stopTimeTracking() { if (sharingInterval) clearInterval(sharingInterval); sharingInterval = null; }
        function updateProgressUI() {
            const h = Math.floor(dailySharedSeconds / 3600).toString().padStart(2, '0'), m = Math.floor((dailySharedSeconds % 3600) / 60).toString().padStart(2, '0'), s = (dailySharedSeconds % 60).toString().padStart(2, '0');
            document.querySelectorAll('.daily-time-display').forEach(el => el.textContent = `${h}:${m}:${s}`);
            const percent = Math.min((dailySharedSeconds / GOAL_SECONDS) * 100, 100);
            document.getElementById('progress-bar').style.width = `${percent}%`; document.getElementById('progress-percent').textContent = `${Math.floor(percent)}%`;
        }

        document.getElementById('btn-save-goal').onclick = async () => {
            const newGoal = document.getElementById('room-goal-input').value.trim();
            if (!myNick || !newGoal) return;
            
            const userRef = doc(db, DB_COLLECTION, myNick);
            const snap = await getDoc(userRef);
            let history = (snap.exists() && snap.data().goalHistory) ? snap.data().goalHistory : [];
            
            const daysKey = ['월', '화', '수', '목', '금', '토', '일'];
            const currentDayName = daysKey[get3AMDayIndex()];
            
            history = history.filter(h => h.day !== currentDayName);
            history.unshift({ day: currentDayName, goal: newGoal });

            await updateDoc(userRef, { 
                goal: newGoal,
                goalHistory: history 
            });
            showToast("오늘의 목표 저장 및 기록 완료!");
        };

        const POMO_WORK = 25 * 60, POMO_BREAK = 5 * 60; let pomoSec = POMO_WORK, isPomoRun = false, pomoInt = null, pomoMode = 'work';
        const display = document.getElementById('pomo-display'), fill = document.getElementById('pomo-bg-fill');
        function setPomo(mode) {
            if(isPomoRun) togglePomo(); pomoMode = mode; pomoSec = mode === 'work' ? POMO_WORK : POMO_BREAK;
            document.getElementById('mode-work').className = mode === 'work' ? 'px-5 py-2 rounded-full text-base font-bold bg-gray-900 text-white shadow-md' : 'px-5 py-2 rounded-full text-base font-bold text-gray-500 hover:bg-gray-100';
            document.getElementById('mode-break').className = mode === 'break' ? 'px-5 py-2 rounded-full text-base font-bold text-gray-500 hover:bg-gray-100';
            updatePomo();
        }
        function updatePomo() {
            display.textContent = `${Math.floor(pomoSec / 60).toString().padStart(2, '0')}:${(pomoSec % 60).toString().padStart(2, '0')}`;
            const total = pomoMode === 'work' ? POMO_WORK : POMO_BREAK; fill.style.transform = `scaleY(${((total - pomoSec) / total)})`;
            fill.className = `absolute inset-0 origin-bottom transform scale-y-0 transition-transform duration-1000 ease-linear ${pomoMode === 'work' ? 'bg-gray-50' : 'bg-green-50'}`;
        }
        function togglePomo() {
            if (isPomoRun) { clearInterval(pomoInt); isPomoRun = false; document.getElementById('btn-pomo-start').textContent = "계속하기"; }
            else {
                isPomoRun = true; document.getElementById('btn-pomo-start').textContent = "일시정지";
                pomoInt = setInterval(() => { if (pomoSec > 0) { pomoSec--; updatePomo(); } else { showToast(pomoMode === 'work' ? "휴식!" : "집중!"); setPomo(pomoMode === 'work' ? 'break' : 'work'); } }, 1000);
            }
        }
        document.getElementById('mode-work').onclick = () => setPomo('work'); document.getElementById('mode-break').onclick = () => setPomo('break');
        document.getElementById('btn-pomo-start').onclick = togglePomo; document.getElementById('btn-pomo-reset').onclick = () => setPomo(pomoMode);

        window.renderCommunityLog = function() {
            const daysKey = ['월', '화', '수', '목', '금', '토', '일'];
            const todayIdx = get3AMDayIndex();

            const communityListEl = document.getElementById('community-list');
            const monthlyGridEl = document.getElementById('monthly-author-grid');

            communityListEl.innerHTML = publicUsers.map(u => {
                const warnCount = u.warnings || 0;
                let heartsHtml = '';
                for(let i = 0; i < 3; i++) {
                    heartsHtml += (i < (3 - warnCount)) ? '❤️ ' : '💔 ';
                }
                if(warnCount >= 3) heartsHtml = '<span class="text-red-500 font-bold">퇴출 완료</span>';

                const h = Math.floor((u.dailySeconds || 0) / 3600);
                const m = Math.floor(((u.dailySeconds || 0) % 3600) / 60);
                const progress = Math.min(((u.dailySeconds || 0) / GOAL_SECONDS) * 100, 100);
                
                const userTotalSec = u.totalSeconds || u.dailySeconds || 0;
                const totalH = Math.floor(userTotalSec / 3600);
                const totalM = Math.floor((userTotalSec % 3600) / 60);

                const weekDaysOrder = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
                
                let weekHtml = weekDaysOrder.map((dayKey, idx) => {
                    let icon = '-';
                    if (idx <= 3) {
                        icon = '😊';
                    } else if (idx < todayIdx) {
                        const wLogs = u.weeklyLogs || {};
                        icon = wLogs[dayKey] ? '😊' : '🥲';
                    } else if (idx === todayIdx) {
                        icon = (u.dailySeconds >= GOAL_SECONDS) ? '😊' : '-';
                    } else {
                        icon = '-';
                    }

                    return `
                        <div class="flex flex-col items-center">
                            <span class="text-xs text-gray-400 font-bold mb-1">${daysKey[idx]}</span>
                            <span class="text-2xl">${icon}</span>
                        </div>
                    `;
                }).join('');

                const historyList = u.goalHistory || [];
                let goalHistoryHtml = historyList.length > 0 ? historyList.map(item => `
                    <li class="text-sm text-gray-700 flex items-center gap-2">
                        <span class="font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">[${item.day}]</span>
                        <span>${item.goal}</span>
                    </li>
                `).join('') : `<li class="text-sm text-gray-400">아직 저장된 목표 기록이 없습니다.</li>`;

                return `
                    <div class="bg-white rounded-3xl p-8 card-shadow border border-gray-100 flex flex-col gap-6 relative overflow-hidden">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-gray-50 pb-5">
                            <div class="flex items-center gap-5">
                                <div class="w-16 h-16 rounded-2xl bg-gray-900 text-white font-bold text-2xl flex items-center justify-center shadow-md">
                                    ${u.id.charAt(0)}
                                </div>
                                <div>
                                    <h3 class="font-bold text-2xl text-gray-900">${u.id}</h3>
                                    <p class="text-sm text-gray-500 mt-1">오늘의 목표: <span class="text-gray-900 font-bold">${u.goal || '목표 미설정'}</span></p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3 bg-gray-50 px-5 py-2.5 rounded-2xl border border-gray-100 self-start sm:self-center">
                                <span class="text-sm text-gray-500 font-bold">남은 생명</span>
                                <div class="text-lg tracking-widest">${heartsHtml}</div>
                            </div>
                        </div>

                        <div>
                            <div class="flex justify-between items-center text-sm font-bold text-gray-600 mb-2">
                                <span>오늘 작업 (${h}시간 ${m}분 / 2시간 목표)</span>
                                <div class="flex items-center gap-2">
                                    <span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-xl font-bold text-xs">총 누적 ${totalH}시간 ${totalM}분</span>
                                    <span class="text-gray-900 text-base">${Math.floor(progress)}%</span>
                                </div>
                            </div>
                            <div class="w-full bg-gray-100 rounded-full h-3.5 overflow-hidden">
                                <div class="h-full bg-emerald-500 rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <div class="bg-gray-50/70 rounded-2xl p-5 border border-gray-100">
                            <span class="text-sm font-bold text-gray-500 block mb-3">주간 7일 마감 현황 (새벽 3시 정산)</span>
                            <div class="grid grid-cols-7 gap-2 text-center">
                                ${weekHtml}
                            </div>
                        </div>

                        <div class="bg-indigo-50/30 rounded-2xl p-5 border border-indigo-50/50">
                            <span class="text-sm font-bold text-indigo-900 block mb-3">📌 이번 주 집필 목표 기록</span>
                            <ul class="space-y-2">
                                ${goalHistoryHtml}
                            </ul>
                        </div>
                    </div>`;
            }).join('') || '<div class="text-gray-400 py-10 text-center">참여자가 없습니다.</div>';

            const now = new Date();
            document.getElementById('month-label').textContent = `${now.getMonth() + 1}월 현황`;

            monthlyGridEl.innerHTML = publicUsers.map(u => {
                const userTotalSec = u.totalSeconds || u.dailySeconds || 0;
                const totalH = Math.floor(userTotalSec / 3600);
                const totalM = Math.floor((userTotalSec % 3600) / 60);

                const todayProgress = Math.min(((u.dailySeconds || 0) / GOAL_SECONDS) * 100, 100);
                const avgProgress = Math.min(Math.floor((400 + todayProgress) / 5), 100);

                return `
                    <div class="bg-gray-50 p-6 rounded-3xl border border-gray-100 flex flex-col gap-4">
                        <div class="flex items-center gap-3 border-b border-gray-200/60 pb-3">
                            <div class="w-10 h-10 rounded-xl bg-gray-900 text-white font-bold text-lg flex items-center justify-center">
                                ${u.id.charAt(0)}
                            </div>
                            <span class="font-bold text-lg text-gray-900">${u.id} 작가</span>
                        </div>
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between items-center">
                                <span class="text-gray-500 font-medium">이달의 총 작업 시간</span>
                                <span class="font-bold text-gray-900 text-base">${totalH}시간 ${totalM}분</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-500 font-medium">이달의 평균 달성률</span>
                                <span class="font-bold text-emerald-600 text-base">${avgProgress}%</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('') || '<div class="text-gray-400 col-span-full py-6 text-center">참여자가 없습니다.</div>';
        };

        window.addEventListener('beforeunload', () => { if (myNick) updateDoc(doc(db, DB_COLLECTION, myNick), { isOnline: false, isSharing: false, lastActive: serverTimestamp() }); });
    </script>
</body>
</html>
