<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마감방 - 웹소설 작가 작업실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face {
            font-family: 'LeeSeoyun';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/LeeSeoyun.woff') format('woff');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        body { font-family: 'LeeSeoyun', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #FAFAFA; color: #111827; }
        
        .tab-content { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .tab-content.active { display: block; opacity: 1; }
        .video-blur { filter: blur(4px); }
        .hidden-safely { display: none !important; }
        .card-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); }
        
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast-exit { transform: translateY(0); opacity: 1; }
        .toast-exit-active { transform: translateY(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-gray-200">

    <!-- 로그인 오버레이 -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-900/60 backdrop-blur-md z-50 flex items-center justify-center">
        <div class="bg-white rounded-3xl p-8 shadow-xl max-w-md w-full mx-4 text-center">
            <h2 class="text-3xl font-bold text-gray-900 mb-6">마감방 입장</h2>
            <input type="text" id="nickname-input" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-5 py-4 text-center text-xl mb-4 focus:outline-none focus:ring-2 focus:ring-gray-900" placeholder="닉네임 (예: 김작가)">
            <button type="button" onclick="window.doLogin()" class="w-full py-4 bg-gray-900 text-white rounded-xl font-bold text-xl hover:bg-gray-800 transition">입장하기</button>
        </div>
    </div>

    <!-- 헤더 -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-gray-900">마감방</h1>
            <nav class="flex items-center gap-8 text-lg">
                <button class="nav-btn text-gray-900 font-bold border-b-2 border-gray-900 pb-1 transition-colors" data-target="tab-room">집필실</button>
                <button class="nav-btn text-gray-400 hover:text-gray-900 font-bold pb-1 transition-colors" data-target="tab-community">Log</button>
            </nav>
            <div class="flex items-center gap-2 font-bold bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
                내 생명: <span id="my-hearts" class="text-red-500 ml-1">❤️❤️❤️</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-6 w-full py-8">
        <!-- 탭 1: 집필실 -->
        <section id="tab-room" class="tab-content active space-y-8">
            <div class="flex flex-col lg:flex-row gap-8">
                <!-- 비디오 영역 -->
                <div class="lg:w-2/3 space-y-4">
                    <div class="flex flex-col xl:flex-row xl:justify-between xl:items-end mb-4 gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-900">실시간 집필실</h2>
                            <p class="text-gray-500 text-sm mt-1">서로의 마감을 응원합니다</p>
                        </div>
                        <div class="flex items-center gap-3 bg-white p-2 rounded-xl shadow-sm border border-gray-100 flex-wrap">
                            <label class="flex items-center gap-2 cursor-pointer font-bold px-2 text-gray-700">
                                <input type="checkbox" id="blur-toggle" class="w-4 h-4 rounded text-gray-900" checked> 모자이크
                            </label>
                            <div class="w-px h-5 bg-gray-200"></div>
                            <button id="btn-cam" onclick="window.startStream('cam')" class="px-4 py-2 bg-gray-100 text-gray-900 rounded-lg font-bold hover:bg-gray-200 transition">웹캠</button>
                            <button id="btn-screen" onclick="window.startStream('screen')" class="px-4 py-2 bg-gray-900 text-white rounded-lg font-bold hover:bg-gray-800 transition">화면공유</button>
                            <button id="btn-stop" onclick="window.stopStream()" class="hidden-safely px-4 py-2 bg-red-50 text-red-600 rounded-lg font-bold hover:bg-red-100 transition">중지</button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="video-grid">
                        <div class="bg-white card-shadow border border-gray-100 rounded-2xl overflow-hidden relative aspect-[4/3] flex items-center justify-center">
                            <video id="video-element" class="w-full h-full object-cover hidden-safely video-blur absolute inset-0 z-20" autoplay playsinline muted></video>
                            <div class="z-10 font-bold text-gray-400">대기 중</div>
                            <div class="absolute top-3 left-3 bg-black/60 text-white text-sm px-3 py-1 rounded-full z-30 font-bold">나 (<span id="my-time-display">00:00</span>)</div>
                        </div>
                    </div>
                </div>

                <!-- 뽀모도로 및 진행도 영역 -->
                <div class="lg:w-1/3 flex flex-col gap-6">
                    <div class="bg-white rounded-3xl p-6 card-shadow border border-gray-100">
                        <h3 class="font-bold text-lg mb-2 text-gray-900">오늘의 마감 (2시간 목표)</h3>
                        <div class="text-4xl font-light text-gray-900 mb-4 tracking-tight" id="daily-time-display">00:00</div>
                        <div class="w-full bg-gray-100 rounded-full h-2">
                            <div id="progress-bar" class="bg-gray-900 h-full rounded-full transition-all duration-1000" style="width: 0%;"></div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-6 card-shadow border border-gray-100 text-center relative">
                        <div class="absolute top-6 right-6">
                            <button id="btn-mute" class="text-gray-400 hover:text-gray-900 transition-colors" title="소리 켜기/끄기">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l3.707 3.707a1 1 0 001.707-.707V4.95a1 1 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z"></path></svg>
                            </button>
                        </div>
                        <h3 class="font-bold text-lg mb-4 text-gray-900 text-left">개인 뽀모도로</h3>
                        <div class="text-6xl font-light text-gray-900 mb-6 tabular-nums" id="pomo-display">25:00</div>
                        <button id="btn-pomo-start" class="px-8 py-3 bg-gray-900 text-white rounded-xl font-bold mb-6 hover:bg-gray-800 transition shadow-md">집중 시작하기</button>
                        <div id="tomato-container" class="flex flex-wrap justify-center gap-1 text-2xl min-h-[32px]"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 탭 2: Log (현황판) -->
        <section id="tab-community" class="tab-content space-y-8">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-end gap-6">
                <div>
                    <h2 class="text-3xl font-bold text-gray-900">동료 작가 마감 현황</h2>
                    <p class="text-gray-500 text-base mt-1">서로의 마감을 응원합니다 (매일 오전 3시 리셋)</p>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-gray-100 card-shadow text-base text-gray-600">
                    <h4 class="font-bold text-gray-900 mb-3 flex items-center gap-2 text-lg">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        마감방 규칙
                    </h4>
                    <ul class="space-y-2 text-sm">
                        <li class="flex items-start gap-2"><span class="text-gray-400">•</span> 하루 2시간 이상 작업 필수</li>
                        <li class="flex items-start gap-2"><span class="text-gray-400">•</span> 주 5회 이상 2시간 작업 미달성 시 하트가 하나씩 차감 (매일 새벽 3시 갱신)</li>
                    </ul>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="community-list"></div>
        </section>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script>
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-gray-900 text-white px-6 py-4 rounded-2xl shadow-xl flex items-center gap-3 toast-enter pointer-events-auto';
            toast.innerHTML = `<span class="font-bold">${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });
            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.classList.add('toast-exit-active');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-gray-900', 'text-gray-400'));
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('border-b-2', 'border-gray-900'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                this.classList.add('text-gray-900', 'border-b-2', 'border-gray-900');
                this.classList.remove('text-gray-400');
                document.getElementById(this.dataset.target).classList.add('active');
            });
        });
        
        function doLogin() {
            const nick = document.getElementById('nickname-input').value.trim();
            if(!nick) return;
            localStorage.setItem('dr_nick', nick);
            document.getElementById('login-overlay').classList.add('hidden-safely');
            window.dispatchEvent(new CustomEvent('init-app', { detail: nick }));
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('dr_nick');
            if(saved) {
                document.getElementById('nickname-input').value = saved;
                doLogin();
            }
        });
    </script>

    <!-- Firebase 및 메인 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCgNwW2-sWbwW_t3ql8Zkg4osAvR294_x4", 
            authDomain: "deadline-room-768bf.firebaseapp.com", 
            projectId: "deadline-room-768bf" 
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // ★ 결정적 문제 해결: 엉뚱한 새 방(users)이 아닌 기존 동료들이 있는 원래 방으로 정확히 연결합니다.
        const DB_COLLECTION = 'artifacts/app/users';
        const GOAL_SECONDS = 2 * 60 * 60; 
        
        let myNick = '';
        let uid = '';
        let myData = { seconds: 0, tomatoes: 0, hearts: 3, lastResetDate: '', yesterdaySuccess: true };
        let workInterval = null;
        let peer = null;
        let mediaStream = null;
        let currentCalls = {};

        function getLogicalDate() {
            let d = new Date();
            if(d.getHours() < 3) d.setDate(d.getDate() - 1);
            return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
        }

        function formatTime(secs) {
            secs = Number(secs);
            if (isNaN(secs) || secs < 0) secs = 0;
            const h = String(Math.floor(secs / 3600)).padStart(2, '0');
            const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
            const s = String(secs % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        window.addEventListener('init-app', async (e) => {
            myNick = e.detail;
            try {
                const cred = await signInAnonymously(auth);
                uid = cred.user.uid;
                
                const userRef = doc(db, DB_COLLECTION, uid);
                const snap = await getDoc(userRef);
                const today = getLogicalDate();
                
                if (snap.exists()) {
                    let data = snap.data();
                    if (data.lastResetDate !== today) {
                        let currentHearts = data.hearts;
                        let ySuccess = true;
                        if (data.seconds < GOAL_SECONDS) {
                            currentHearts = Math.max(0, currentHearts - 1);
                            ySuccess = false;
                        }
                        myData = { seconds: 0, tomatoes: 0, hearts: currentHearts, lastResetDate: today, yesterdaySuccess: ySuccess };
                    } else {
                        myData = { 
                            seconds: data.seconds || 0, tomatoes: data.tomatoes || 0, 
                            hearts: data.hearts || 3, lastResetDate: data.lastResetDate, 
                            yesterdaySuccess: data.yesterdaySuccess ?? true 
                        };
                    }
                } else {
                    myData = { seconds: 0, tomatoes: 0, hearts: 3, lastResetDate: today, yesterdaySuccess: true };
                }
                
                await setDoc(userRef, {
                    nickname: myNick, 
                    peerId: uid,
                    seconds: myData.seconds, 
                    tomatoes: myData.tomatoes,
                    hearts: myData.hearts, 
                    lastResetDate: myData.lastResetDate, 
                    yesterdaySuccess: myData.yesterdaySuccess,
                    lastActive: serverTimestamp(), 
                    isOnline: true,
                    isSharing: false
                }, { merge: true });

                showToast(`환영합니다, ${myNick} 작가님!`);

                updateUI();
                startHeartbeat();
                initWebRTC();
                listenToOthers();
            } catch (err) {
                console.error("Firebase Error: ", err);
                showToast("로그인에 실패했습니다. (권한 또는 네트워크 오류)");
            }
        });

        function startHeartbeat() {
            setInterval(() => {
                if(uid) updateDoc(doc(db, DB_COLLECTION, uid), { lastActive: serverTimestamp(), isOnline: true });
            }, 30000);
        }

        window.startStream = async (type) => {
            try {
                if(type === 'screen') {
                    mediaStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                    showToast("화면 공유가 시작되었습니다.");
                } else {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    showToast("웹캠 공유가 시작되었습니다.");
                }
                
                document.getElementById('video-element').srcObject = mediaStream;
                document.getElementById('video-element').classList.remove('hidden-safely');
                document.getElementById('btn-screen').classList.add('hidden-safely');
                document.getElementById('btn-cam').classList.add('hidden-safely');
                document.getElementById('btn-stop').classList.remove('hidden-safely');
                
                if(uid) updateDoc(doc(db, DB_COLLECTION, uid), { isSharing: true });

                callOtherPeers();
                
                workInterval = setInterval(() => {
                    myData.seconds += 1;
                    updateUI(); 
                    if(myData.seconds === GOAL_SECONDS) showToast("🎉 축하합니다! 오늘의 목표 마감(2시간)을 달성했습니다.");
                    if(myData.seconds % 60 === 0) updateDoc(doc(db, DB_COLLECTION, uid), { seconds: myData.seconds });
                }, 1000);

                mediaStream.getVideoTracks()[0].onended = () => { window.stopStream(); };
            } catch (e) {
                showToast("공유를 취소했거나 권한이 없습니다.");
            }
        };

        window.stopStream = () => {
            if(mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
            document.getElementById('video-element').classList.add('hidden-safely');
            document.getElementById('btn-screen').classList.remove('hidden-safely');
            document.getElementById('btn-cam').classList.remove('hidden-safely');
            document.getElementById('btn-stop').classList.add('hidden-safely');
            clearInterval(workInterval);
            if(uid) updateDoc(doc(db, DB_COLLECTION, uid), { isSharing: false });
            
            Object.values(currentCalls).forEach(call => call.close());
            currentCalls = {};
            showToast("작업이 일시 중지되었습니다.");
        };

        function updateUI() {
            const timeStr = formatTime(myData.seconds);
            document.getElementById('my-time-display').innerText = timeStr;
            document.getElementById('daily-time-display').innerText = timeStr;
            const pct = Math.min(100, (myData.seconds / GOAL_SECONDS) * 100);
            document.getElementById('progress-bar').style.width = pct + '%';
            
            let safeHearts = Number(myData.hearts);
            if (isNaN(safeHearts) || safeHearts < 0) safeHearts = 0;
            document.getElementById('my-hearts').innerText = '❤️'.repeat(safeHearts) || '💔 퇴출 위기';
            
            let safeTomatoes = Number(myData.tomatoes);
            if (isNaN(safeTomatoes) || safeTomatoes < 0) safeTomatoes = 0;
            document.getElementById('tomato-container').innerText = '🍅'.repeat(safeTomatoes);
        }

        let onlinePeers = [];
        function listenToOthers() {
            onSnapshot(collection(db, DB_COLLECTION), (snapshot) => {
                const now = Date.now();
                const logList = document.getElementById('community-list');
                const newHTML = [];
                onlinePeers = [];
                
                snapshot.forEach(docSnap => {
                    try {
                        const data = docSnap.data() || {};
                        const isMe = docSnap.id === uid; 
                        const nickname = String(data.nickname || '익명 작가');
                        const initial = nickname.charAt(0) || '?';
                        
                        let seconds = Number(data.seconds);
                        if (isNaN(seconds) || seconds < 0) seconds = 0;

                        let hearts = Number(data.hearts);
                        if (isNaN(hearts) || hearts < 0) hearts = 0;

                        let lastActiveMs = 0;
                        if (data.lastActive) {
                            if (typeof data.lastActive.toMillis === 'function') lastActiveMs = data.lastActive.toMillis();
                            else if (data.lastActive.seconds) lastActiveMs = data.lastActive.seconds * 1000;
                            else if (typeof data.lastActive === 'number') lastActiveMs = data.lastActive;
                        }

                        const isOffline = (now - lastActiveMs) > 60000;

                        if (!isOffline && !isMe && data.peerId) {
                            onlinePeers.push(data.peerId);
                        }

                        if(isOffline && !isMe && data.peerId) {
                            const staleVideo = document.getElementById(`video-box-${data.peerId}`);
                            if(staleVideo) staleVideo.remove();
                        }

                        const timeTxt = formatTime(seconds);
                        const heartTxt = '❤️'.repeat(hearts) || '💔 (0)';
                        const progressPct = Math.min(100, (seconds / GOAL_SECONDS) * 100);
                        
                        const statusColor = isOffline ? 'bg-gray-300' : 'bg-green-500';
                        const statusText = isOffline ? '오프라인' : '접속 중';
                        const statusTextColor = isOffline ? 'text-gray-400' : 'text-green-500 font-bold';
                        
                        const fridayFace = (data.yesterdaySuccess ?? true) ? '😊' : '😢';
                        const displayName = isMe ? `${nickname} <span class="text-indigo-500 text-sm">(나)</span>` : nickname;

                        newHTML.push(`
                            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col gap-5 card-shadow hover:scale-[1.01] transition-transform">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-4">
                                        <div class="relative">
                                            <div class="w-12 h-12 bg-gray-100 rounded-2xl flex items-center justify-center text-xl font-bold text-gray-700">
                                                ${initial}
                                            </div>
                                            <div class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full border-2 border-white ${statusColor}"></div>
                                        </div>
                                        <div>
                                            <h4 class="font-bold text-lg text-gray-900">${displayName}</h4>
                                            <div class="text-sm text-gray-500 mt-0.5">남은 생명: ${heartTxt}</div>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-sm ${statusTextColor}">${statusText}</div>
                                    </div>
                                </div>
                                
                                <div>
                                    <div class="flex justify-between text-sm mb-1.5">
                                        <span class="font-bold text-gray-700">오늘의 마감 목표 (2시간)</span>
                                        <span class="font-bold text-gray-900">${timeTxt}</span>
                                    </div>
                                    <div class="w-full bg-gray-100 rounded-full h-2.5 mb-4">
                                        <div class="bg-gray-900 h-full rounded-full transition-all" style="width: ${progressPct}%;"></div>
                                    </div>
                                    
                                    <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl text-sm border border-gray-100">
                                        <span class="font-bold text-gray-600">이번 주 달성 기록</span>
                                        <div class="flex gap-4 text-center">
                                            <div class="flex flex-col items-center gap-1.5"><span class="text-xs font-bold text-gray-400">월</span><span class="text-lg leading-none">😊</span></div>
                                            <div class="flex flex-col items-center gap-1.5"><span class="text-xs font-bold text-gray-400">화</span><span class="text-lg leading-none">😊</span></div>
                                            <div class="flex flex-col items-center gap-1.5"><span class="text-xs font-bold text-gray-400">수</span><span class="text-lg leading-none">😊</span></div>
                                            <div class="flex flex-col items-center gap-1.5"><span class="text-xs font-bold text-gray-400">목</span><span class="text-lg leading-none">😊</span></div>
                                            <div class="flex flex-col items-center gap-1.5"><span class="text-xs font-bold text-gray-400">금</span><span class="text-lg leading-none">${fridayFace}</span></div>
                                            <div class="flex flex-col items-center gap-1.5"><span class="text-xs font-bold text-gray-400">토</span><span class="text-lg leading-none text-gray-300">-</span></div>
                                            <div class="flex flex-col items-center gap-1.5"><span class="text-xs font-bold text-gray-400">일</span><span class="text-lg leading-none text-gray-300">-</span></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `);
                    } catch (e) { }
                });
                
                logList.innerHTML = newHTML.join('');
                callOtherPeers();
            });
        }

        let isMuted = false;
        document.getElementById('btn-mute').addEventListener('click', (e) => {
            isMuted = !isMuted;
            const btn = e.currentTarget;
            if (isMuted) {
                btn.innerHTML = `<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>`;
                showToast("뽀모도로 알림음이 음소거되었습니다.");
            } else {
                btn.innerHTML = `<svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l3.707 3.707a1 1 0 001.707-.707V4.95a1 1 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z"></path></svg>`;
                showToast("뽀모도로 알림음이 켜졌습니다.");
            }
        });

        function playBeep() {
            if (isMuted) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.connect(ctx.destination);
                osc.frequency.value = 800;
                osc.start();
                setTimeout(() => osc.stop(), 500);
            } catch (e) {}
        }

        let pomoTime = 25 * 60;
        let pomoTimer = null;
        document.getElementById('btn-pomo-start').addEventListener('click', () => {
            const btn = document.getElementById('btn-pomo-start');
            if(pomoTimer) {
                clearInterval(pomoTimer);
                pomoTimer = null;
                btn.innerText = "집중 다시 시작";
                btn.classList.replace('bg-red-500', 'bg-gray-900');
                return;
            }
            
            btn.innerText = "일시정지";
            btn.classList.replace('bg-gray-900', 'bg-red-500');
            
            pomoTimer = setInterval(() => {
                pomoTime--;
                const m = String(Math.floor(pomoTime / 60)).padStart(2, '0');
                const s = String(pomoTime % 60).padStart(2, '0');
                document.getElementById('pomo-display').innerText = `${m}:${s}`;
                
                if(pomoTime <= 0) {
                    clearInterval(pomoTimer);
                    pomoTimer = null;
                    pomoTime = 25 * 60;
                    myData.tomatoes += 1;
                    updateDoc(doc(db, DB_COLLECTION, uid), { tomatoes: myData.tomatoes });
                    updateUI();
                    btn.innerText = "집중 시작하기";
                    btn.classList.replace('bg-red-500', 'bg-gray-900');
                    playBeep();
                    showToast("🍅 뽀모도로 완료! 토마토를 획득했습니다. 5분간 휴식하세요.");
                }
            }, 1000);
        });

        window.addEventListener('beforeunload', () => {
            if(uid) updateDoc(doc(db, DB_COLLECTION, uid), { isOnline: false, isSharing: false });
        });

        function initWebRTC() {
            peer = new Peer(uid);
            peer.on('call', call => {
                call.answer(mediaStream || undefined);
                currentCalls[call.peer] = call;
                call.on('stream', remoteStream => attachRemoteVideo(call.peer, remoteStream));
            });
        }
        
        function callOtherPeers() {
            if (!peer || !mediaStream) return;
            onlinePeers.forEach(peerId => {
                if (!currentCalls[peerId]) {
                    const call = peer.call(peerId, mediaStream);
                    if (call) {
                        currentCalls[peerId] = call;
                        call.on('stream', remoteStream => attachRemoteVideo(peerId, remoteStream));
                    }
                }
            });
        }

        function attachRemoteVideo(peerId, remoteStream) {
            let box = document.getElementById(`video-box-${peerId}`);
            if(!box) {
                box = document.createElement('div');
                box.id = `video-box-${peerId}`;
                box.className = "bg-white card-shadow border border-gray-100 rounded-2xl overflow-hidden relative aspect-[4/3] flex items-center justify-center";
                box.innerHTML = `
                    <video id="vid-${peerId}" class="w-full h-full object-cover video-blur absolute inset-0 z-20" autoplay playsinline></video>
                    <div class="absolute top-3 left-3 bg-black/60 text-white text-sm px-3 py-1 rounded-full z-30 font-bold">동료 작가</div>
                `;
                document.getElementById('video-grid').appendChild(box);
            }
            const vid = document.getElementById(`vid-${peerId}`);
            if (vid.srcObject !== remoteStream) vid.srcObject = remoteStream;
        }
        
        document.getElementById('blur-toggle').addEventListener('change', (e) => {
            const vids = document.querySelectorAll('video');
            if(e.target.checked) vids.forEach(v => v.classList.add('video-blur'));
            else vids.forEach(v => v.classList.remove('video-blur'));
        });
    </script>
</body>
</html>
