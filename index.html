<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마감방 - 웹소설 작가 작업실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face {
            font-family: 'LeeSeoyun';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/LeeSeoyun.woff') format('woff');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        body { font-family: 'LeeSeoyun', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #FAFAFA; color: #111827; }
        
        .tab-content { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .tab-content.active { display: block; opacity: 1; }
        .video-blur { filter: blur(4px); }
        .hidden-safely { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-gray-200">

    <!-- 로그인 오버레이 -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-900/60 backdrop-blur-md z-50 flex items-center justify-center">
        <div class="bg-white rounded-3xl p-8 shadow-xl max-w-md w-full mx-4 text-center">
            <h2 class="text-3xl font-bold text-gray-900 mb-6">마감방 입장</h2>
            <input type="text" id="nickname-input" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-5 py-4 text-center text-xl mb-4" placeholder="닉네임 (예: 김작가)">
            <button type="button" onclick="window.doLogin()" class="w-full py-4 bg-gray-900 text-white rounded-xl font-bold text-xl hover:bg-gray-800 transition">입장하기</button>
        </div>
    </div>

    <!-- 헤더 -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-gray-900">마감방</h1>
            <nav class="flex items-center gap-8 text-lg">
                <button class="nav-btn text-gray-900 font-bold border-b-2 border-gray-900 pb-1" data-target="tab-room">집필실</button>
                <button class="nav-btn text-gray-400 hover:text-gray-900 font-bold pb-1" data-target="tab-community">Log</button>
            </nav>
            <div class="flex items-center gap-2 font-bold">
                생명: <span id="my-hearts" class="text-red-500">❤️❤️❤️</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-6 w-full py-8">
        <!-- 탭 1: 집필실 -->
        <section id="tab-room" class="tab-content active space-y-8">
            <div class="flex flex-col lg:flex-row gap-8">
                <!-- 비디오 영역 -->
                <div class="lg:w-2/3 space-y-4">
                    <div class="flex justify-between items-end mb-4">
                        <h2 class="text-2xl font-bold text-gray-900">실시간 집필실</h2>
                        <div class="flex items-center gap-3">
                            <label class="flex items-center gap-2 cursor-pointer font-bold">
                                <input type="checkbox" id="blur-toggle" class="w-4 h-4 rounded text-gray-900" checked> 화면 모자이크
                            </label>
                            <button id="btn-screen" onclick="window.startStream('screen')" class="px-4 py-2 bg-gray-900 text-white rounded-lg font-bold">화면공유</button>
                            <button id="btn-stop" onclick="window.stopStream()" class="hidden-safely px-4 py-2 bg-red-100 text-red-600 rounded-lg font-bold">중지</button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4" id="video-grid">
                        <div class="bg-gray-100 rounded-2xl overflow-hidden relative aspect-video flex items-center justify-center">
                            <video id="video-element" class="w-full h-full object-cover hidden-safely video-blur absolute inset-0 z-20" autoplay playsinline muted></video>
                            <div class="z-10 font-bold text-gray-400">내 화면 대기중</div>
                            <div class="absolute top-3 left-3 bg-black/60 text-white text-sm px-3 py-1 rounded-full z-30">나 (<span id="my-time-display">00:00</span>)</div>
                        </div>
                        <!-- 다른 유저 비디오 삽입 공간 -->
                    </div>
                </div>

                <!-- 뽀모도로 및 진행도 영역 -->
                <div class="lg:w-1/3 flex flex-col gap-6">
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
                        <h3 class="font-bold text-lg mb-2">오늘의 마감 (2시간 목표)</h3>
                        <div class="text-3xl font-bold text-gray-900 mb-2" id="daily-time-display">00:00</div>
                        <div class="w-full bg-gray-100 rounded-full h-2">
                            <div id="progress-bar" class="bg-gray-900 h-full rounded-full transition-all" style="width: 0%;"></div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 text-center">
                        <h3 class="font-bold text-lg mb-4">뽀모도로 타이머</h3>
                        <div class="text-5xl font-light text-gray-900 mb-4" id="pomo-display">25:00</div>
                        <button id="btn-pomo-start" class="px-6 py-2 bg-gray-900 text-white rounded-lg font-bold mb-4">시작</button>
                        <div id="tomato-container" class="flex flex-wrap justify-center gap-1 text-xl min-h-[30px]"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 탭 2: Log (현황판) -->
        <section id="tab-community" class="tab-content space-y-6">
            <h2 class="text-2xl font-bold text-gray-900">동료 작가 작업 현황</h2>
            <div class="grid grid-cols-1 gap-4" id="community-list"></div>
        </section>
    </main>

    <script>
        // 탭 전환 로직
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-gray-900', 'text-gray-400'));
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('border-b-2', 'border-gray-900'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                this.classList.add('text-gray-900', 'border-b-2', 'border-gray-900');
                this.classList.remove('text-gray-400');
                document.getElementById(this.dataset.target).classList.add('active');
            });
        });
        
        function doLogin() {
            const nick = document.getElementById('nickname-input').value.trim();
            if(!nick) return;
            localStorage.setItem('dr_nick', nick);
            document.getElementById('login-overlay').classList.add('hidden-safely');
            window.dispatchEvent(new CustomEvent('init-app', { detail: nick }));
        }
    </script>

    <!-- Firebase 및 메인 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // [주의] 본인의 Firebase 설정값으로 변경 필요
        const firebaseConfig = { 
            apiKey: "AIzaSyCgNwW2-sWbwW_t3ql8Zkg4osAvR294_x4", 
            authDomain: "deadline-room-768bf.firebaseapp.com", 
            projectId: "deadline-room-768bf" 
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const DB_COLLECTION = 'users';
        const GOAL_SECONDS = 2 * 60 * 60; // 2시간
        
        let myNick = '';
        let uid = '';
        let myData = { seconds: 0, tomatoes: 0, hearts: 3, lastResetDate: '' };
        let workInterval = null;
        let peer = null;
        let mediaStream = null;

        // 새벽 3시 기준 논리적 날짜 계산 (예: 11월 5일 새벽 2시 -> 11월 4일로 인식)
        function getLogicalDate() {
            let d = new Date();
            if(d.getHours() < 3) {
                d.setDate(d.getDate() - 1);
            }
            return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
        }

        function formatTime(secs) {
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            return `${h}시간 ${m}분`;
        }

        window.addEventListener('init-app', async (e) => {
            myNick = e.detail;
            
            try {
                const cred = await signInAnonymously(auth);
                uid = cred.user.uid;
                
                const userRef = doc(db, DB_COLLECTION, uid);
                const snap = await getDoc(userRef);
                const today = getLogicalDate();
                
                if (snap.exists()) {
                    let data = snap.data();
                    // 날짜가 바뀌었을 때 리셋 로직 (새벽 3시 지남)
                    if (data.lastResetDate !== today) {
                        let currentHearts = data.hearts;
                        // 전날 2시간 미만 달성 시 하트 차감
                        if (data.seconds < GOAL_SECONDS) {
                            currentHearts = Math.max(0, currentHearts - 1);
                        }
                        myData = { seconds: 0, tomatoes: 0, hearts: currentHearts, lastResetDate: today };
                    } else {
                        myData = { seconds: data.seconds || 0, tomatoes: data.tomatoes || 0, hearts: data.hearts || 3, lastResetDate: data.lastResetDate };
                    }
                } else {
                    myData = { seconds: 0, tomatoes: 0, hearts: 3, lastResetDate: today };
                }
                
                // 내 정보 DB에 기록 및 하트비트(isOnline) 시작
                await setDoc(userRef, {
                    nickname: myNick,
                    seconds: myData.seconds,
                    tomatoes: myData.tomatoes,
                    hearts: myData.hearts,
                    lastResetDate: myData.lastResetDate,
                    lastActive: serverTimestamp(),
                    isOnline: true
                }, { merge: true });

                updateUI();
                startHeartbeat();
                initWebRTC();
                listenToOthers();

            } catch (err) {
                console.error("Firebase Auth Error: ", err);
                alert("로그인에 실패했습니다.");
            }
        });

        // 30초마다 내가 살아있음을 DB에 알림 (오프라인 판별용)
        function startHeartbeat() {
            setInterval(() => {
                if(!uid) return;
                updateDoc(doc(db, DB_COLLECTION, uid), {
                    lastActive: serverTimestamp(),
                    isOnline: true
                });
            }, 30000);
        }

        // 화면 공유 및 작업 시간 측정
        window.startStream = async (type) => {
            try {
                mediaStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                document.getElementById('video-element').srcObject = mediaStream;
                document.getElementById('video-element').classList.remove('hidden-safely');
                document.getElementById('btn-screen').classList.add('hidden-safely');
                document.getElementById('btn-stop').classList.remove('hidden-safely');
                
                // 작업 시간 카운트 시작 (1분에 1번씩만 DB 갱신하여 부하 최소화)
                workInterval = setInterval(() => {
                    myData.seconds += 1;
                    updateUI(); // 내 화면은 실시간 1초마다 렌더링
                    
                    if(myData.seconds % 60 === 0) { // DB는 1분마다 저장
                        updateDoc(doc(db, DB_COLLECTION, uid), { seconds: myData.seconds });
                    }
                }, 1000);

                // 화면 공유 중지 시 처리
                mediaStream.getVideoTracks()[0].onended = () => { window.stopStream(); };

            } catch (e) {
                console.error(e);
                alert("화면 공유를 취소했거나 권한이 없습니다.");
            }
        };

        window.stopStream = () => {
            if(mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            document.getElementById('video-element').classList.add('hidden-safely');
            document.getElementById('btn-screen').classList.remove('hidden-safely');
            document.getElementById('btn-stop').classList.add('hidden-safely');
            clearInterval(workInterval);
        };

        // 내 화면 UI 업데이트
        function updateUI() {
            const timeStr = formatTime(myData.seconds);
            document.getElementById('my-time-display').innerText = timeStr;
            document.getElementById('daily-time-display').innerText = timeStr;
            
            const pct = Math.min(100, (myData.seconds / GOAL_SECONDS) * 100);
            document.getElementById('progress-bar').style.width = pct + '%';
            
            let heartStr = '';
            for(let i=0; i<myData.hearts; i++) heartStr += '❤️';
            document.getElementById('my-hearts').innerText = heartStr || '💔 퇴출 위기';

            let tomatoStr = '';
            for(let i=0; i<myData.tomatoes; i++) tomatoStr += '🍅';
            document.getElementById('tomato-container').innerText = tomatoStr;
        }

        // 다른 유저 데이터 구독 및 오프라인 유저 필터링
        function listenToOthers() {
            onSnapshot(collection(db, DB_COLLECTION), (snapshot) => {
                const now = Date.now();
                const logList = document.getElementById('community-list');
                logList.innerHTML = '';
                
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if(docSnap.id === uid) return;

                    // Heartbeat 로직: 마지막 업데이트가 1분(60000ms) 이상 지났으면 오프라인으로 간주
                    const lastActiveMs = data.lastActive ? data.lastActive.toMillis() : 0;
                    const isOffline = (now - lastActiveMs) > 60000;

                    if(isOffline) {
                        // 오프라인 유저의 영상이 남아있다면 DOM에서 삭제
                        const staleVideo = document.getElementById(`video-box-${docSnap.id}`);
                        if(staleVideo) staleVideo.remove();
                    }

                    // 로그(현황판)에는 등록된 모든 작가 표시 (단, 오프라인 표기)
                    const statusDot = isOffline ? 'bg-gray-300' : 'bg-green-500';
                    const timeTxt = formatTime(data.seconds || 0);
                    let heartTxt = ''; for(let i=0; i<(data.hearts||0); i++) heartTxt+='❤️';
                    
                    logList.innerHTML += `
                        <div class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-xl">
                            <div class="flex items-center gap-3">
                                <div class="w-3 h-3 rounded-full ${statusDot}"></div>
                                <span class="font-bold text-lg">${data.nickname}</span>
                                <span class="text-sm text-gray-500">${heartTxt}</span>
                            </div>
                            <div class="font-bold text-gray-900">${timeTxt}</div>
                        </div>
                    `;
                });
            });
        }

        // 뽀모도로 타이머 로직 (날짜 바뀌면 리셋 적용됨)
        let pomoTime = 25 * 60;
        let pomoTimer = null;
        document.getElementById('btn-pomo-start').addEventListener('click', () => {
            if(pomoTimer) return;
            pomoTimer = setInterval(() => {
                pomoTime--;
                const m = String(Math.floor(pomoTime / 60)).padStart(2, '0');
                const s = String(pomoTime % 60).padStart(2, '0');
                document.getElementById('pomo-display').innerText = `${m}:${s}`;
                
                if(pomoTime <= 0) {
                    clearInterval(pomoTimer);
                    pomoTimer = null;
                    pomoTime = 25 * 60; // 25분 리셋
                    myData.tomatoes += 1;
                    updateDoc(doc(db, DB_COLLECTION, uid), { tomatoes: myData.tomatoes });
                    updateUI();
                    alert("뽀모도로 완료! 토마토를 획득했습니다.");
                }
            }, 1000);
        });

        // 브라우저 닫을 때 오프라인 처리 시도
        window.addEventListener('beforeunload', () => {
            if(uid) updateDoc(doc(db, DB_COLLECTION, uid), { isOnline: false });
        });

        // 간이 WebRTC 초기화 (실제 영상 P2P 통신용)
        function initWebRTC() {
            peer = new Peer(uid);
            // 다른 사람의 전화(영상)가 오면 받고 빈 비디오 박스에 할당하는 로직
            peer.on('call', call => {
                call.answer();
                call.on('stream', remoteStream => {
                    let box = document.getElementById(`video-box-${call.peer}`);
                    if(!box) {
                        box = document.createElement('div');
                        box.id = `video-box-${call.peer}`;
                        box.className = "bg-gray-100 rounded-2xl overflow-hidden relative aspect-video flex items-center justify-center";
                        box.innerHTML = `
                            <video id="vid-${call.peer}" class="w-full h-full object-cover video-blur absolute inset-0 z-20" autoplay playsinline></video>
                            <div class="absolute top-3 left-3 bg-black/60 text-white text-sm px-3 py-1 rounded-full z-30">동료 작가</div>
                        `;
                        document.getElementById('video-grid').appendChild(box);
                    }
                    document.getElementById(`vid-${call.peer}`).srcObject = remoteStream;
                });
            });
        }
        
        // 모자이크 토글 기능
        document.getElementById('blur-toggle').addEventListener('change', (e) => {
            const vids = document.querySelectorAll('video');
            if(e.target.checked) vids.forEach(v => v.classList.add('video-blur'));
            else vids.forEach(v => v.classList.remove('video-blur'));
        });
    </script>
</body>
</html>
