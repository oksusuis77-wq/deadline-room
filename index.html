<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마감방 - 웹소설 작가 작업실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face {
            font-family: 'LeeSeoyun';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/LeeSeoyun.woff') format('woff');
        }
        body { font-family: 'LeeSeoyun', sans-serif; background-color: #FAFAFA; color: #111827; }
        .hidden-safely { display: none !important; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .video-blur { filter: blur(6px); }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden">

    <!-- 로그인 오버레이 -->
    <div id="login-overlay" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center p-8 border rounded-3xl shadow-xl bg-white max-w-sm w-full">
            <h2 class="text-2xl font-bold mb-4">마감방 입장</h2>
            <form onsubmit="window.doLogin(); return false;">
                <input type="text" id="nickname-input" required class="w-full border p-3 rounded-xl mb-4 text-center" placeholder="닉네임 입력">
                <button type="submit" class="w-full bg-gray-900 text-white p-3 rounded-xl font-bold">입장하기</button>
            </form>
        </div>
    </div>

    <!-- 헤더 -->
    <header class="bg-white border-b sticky top-0 z-40 p-4 flex justify-between items-center shadow-sm">
        <h1 class="font-bold text-lg">마감방</h1>
        <div class="flex items-center gap-3">
            <span id="user-info" class="text-sm font-bold text-gray-600">대기중...</span>
        </div>
    </header>

    <main class="p-6 max-w-6xl mx-auto w-full">
        <!-- 상단 컨트롤러 -->
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm">
            <div class="flex items-center gap-4">
                <label class="flex items-center gap-2 cursor-pointer font-bold">
                    <input type="checkbox" id="blur-toggle" checked class="w-5 h-5"> 모자이크
                </label>
            </div>
            <div class="flex gap-2">
                <button id="btn-cam" class="bg-gray-200 px-4 py-2 rounded-xl font-bold">웹캠 공유</button>
                <button id="btn-screen" class="bg-gray-900 text-white px-4 py-2 rounded-xl font-bold">화면 공유</button>
                <button id="btn-stop" class="bg-red-100 text-red-600 px-4 py-2 rounded-xl font-bold hidden-safely">공유 중지</button>
            </div>
        </div>

        <!-- 비디오 그리드 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="video-grid">
            <!-- 내 화면 -->
            <div class="bg-gray-100 rounded-3xl overflow-hidden aspect-[4/3] relative border-2 border-gray-200">
                <video id="video-element" class="w-full h-full object-cover hidden-safely video-blur absolute inset-0 z-10" autoplay playsinline muted></video>
                <div id="video-placeholder" class="absolute inset-0 flex items-center justify-center text-gray-400 font-bold z-0">
                    내 화면
                </div>
                <div class="absolute top-3 left-3 bg-black/50 text-white px-3 py-1 rounded-full text-sm font-bold z-20">
                    나 (<span class="daily-time-display">00:00:00</span>)
                </div>
            </div>
            
            <!-- 다른 사람 화면 (여기에 자동 생성됨) -->
            <div id="other-users-grid" class="contents"></div>
        </div>
    </main>

    <!-- 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, updateDoc, onSnapshot, query, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCgNwW2-sWbwW_t3ql8Zkg4osAvR294_x4",
          authDomain: "deadline-room-768bf.firebaseapp.com",
          projectId: "deadline-room-768bf"
        };
        
        let app = initializeApp(firebaseConfig);
        let auth = getAuth(app);
        let db = getFirestore(app);
        
        let peer = null;
        let isPeerReady = false;
        let currentCalls = {};
        let publicUsers = [];
        let mediaStream = null;
        let dailySharedSeconds = 0;
        let sharingInterval = null;
        let lastTick = null;

        window.doLogin = async () => {
            const nick = document.getElementById('nickname-input').value.trim();
            if(!nick) return;
            localStorage.setItem('deadline_nickname', nick);
            document.getElementById('login-overlay').style.display = 'none';
            document.body.classList.remove('overflow-hidden');
            
            await signInAnonymously(auth);
            document.getElementById('user-info').textContent = `${nick} (온라인)`;
            
            initWebRTC(nick);
            initDB(nick);
        };

        if(localStorage.getItem('deadline_nickname')) {
            window.doLogin = () => {};
            const nick = localStorage.getItem('deadline_nickname');
            document.getElementById('nickname-input').value = nick;
            document.getElementById('login-overlay').style.display = 'none';
            document.body.classList.remove('overflow-hidden');
            signInAnonymously(auth).then(() => {
                document.getElementById('user-info').textContent = `${nick} (온라인)`;
                initWebRTC(nick);
                initDB(nick);
            });
        }

        function initWebRTC(nick) {
            peer = new Peer('peer_' + encodeURIComponent(nick).replace(/%/g, '_'), {
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });
            peer.on('open', () => {
                isPeerReady = true;
                checkAndCallOthers();
            });
            peer.on('call', (call) => {
                call.answer(mediaStream || undefined);
                currentCalls[call.peer] = call;
                call.on('stream', (stream) => addRemoteVideo(call.peer, stream));
            });
        }

        function initDB(nick) {
            const userRef = doc(db, 'artifacts', 'app', 'users', nick);
            setDoc(userRef, { id: nick, isOnline: true, isSharing: false, lastActive: serverTimestamp() }, {merge: true});
            
            getDoc(userRef).then(snap => {
                if(snap.exists() && snap.data().dailySeconds) dailySharedSeconds = snap.data().dailySeconds;
                updateTimeUI();
            });

            onSnapshot(collection(db, 'artifacts', 'app', 'users'), (snap) => {
                publicUsers = [];
                snap.forEach(d => publicUsers.push(d.data()));
                renderOtherUsers();
                checkAndCallOthers();
            });
        }

        function checkAndCallOthers() {
            if(!isPeerReady || !peer) return;
            const myNick = localStorage.getItem('deadline_nickname');
            publicUsers.filter(u => u.id !== myNick && u.isOnline).forEach(u => {
                const pId = 'peer_' + encodeURIComponent(u.id).replace(/%/g, '_');
                if((u.isSharing || mediaStream) && !currentCalls[pId]) {
                    const call = mediaStream ? peer.call(pId, mediaStream) : peer.call(pId);
                    if(call) {
                        currentCalls[pId] = call;
                        call.on('stream', (stream) => addRemoteVideo(pId, stream));
                    }
                }
            });
        }

        async function startStream(type) {
            if(mediaStream) stopStream();
            try {
                mediaStream = await (type === 'cam' ? navigator.mediaDevices.getUserMedia({video:true}) : navigator.mediaDevices.getDisplayMedia({video:true}));
                document.getElementById('video-element').srcObject = mediaStream;
                document.getElementById('video-element').classList.remove('hidden-safely');
                
                document.getElementById('btn-cam').classList.add('hidden-safely');
                document.getElementById('btn-screen').classList.add('hidden-safely');
                document.getElementById('btn-stop').classList.remove('hidden-safely');
                
                updateDBSharing(true);
                startTimer();
                checkAndCallOthers();
                
                mediaStream.getVideoTracks()[0].onended = stopStream;
            } catch(e) { alert("화면 권한이 없습니다."); }
        }

        function stopStream() {
            if(mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
            document.getElementById('video-element').classList.add('hidden-safely');
            
            document.getElementById('btn-cam').classList.remove('hidden-safely');
            document.getElementById('btn-screen').classList.remove('hidden-safely');
            document.getElementById('btn-stop').classList.add('hidden-safely');
            
            updateDBSharing(false);
            stopTimer();
            Object.values(currentCalls).forEach(c => c.close());
            currentCalls = {};
        }

        function updateDBSharing(isSharing) {
            const nick = localStorage.getItem('deadline_nickname');
            if(nick) updateDoc(doc(db, 'artifacts', 'app', 'users', nick), { isSharing });
        }

        document.getElementById('btn-cam').onclick = () => startStream('cam');
        document.getElementById('btn-screen').onclick = () => startStream('screen');
        document.getElementById('btn-stop').onclick = stopStream;
        
        document.getElementById('blur-toggle').onchange = (e) => {
            const isBlur = e.target.checked;
            document.getElementById('video-element').classList.toggle('video-blur', isBlur);
            document.querySelectorAll('.remote-video').forEach(v => v.classList.toggle('video-blur', isBlur));
        };

        function renderOtherUsers() {
            const grid = document.getElementById('other-users-grid');
            const myNick = localStorage.
